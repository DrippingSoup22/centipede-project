// colour scale, built from scaleValues(column) when tables are to be compared.
function profileTable(columns, valuesFor, scaleValues = null) {
  const columnValues = columns.map((column) => perSegment(valuesFor(column.key), column.part));
  const segmentCount = Math.max(0, ...columnValues.map((v) => (v ? v.length : 0)));
  if (!segmentCount) return empty();
  const scales = columns.map((column, i) =>
    colorScale(scaleValues ? scaleValues(column) : columnValues[i] || [], info(column.key).unit, info(column.key).range,
      betterWay(info(column.key), column.part)));
  const head = html("tr", {}, html("th", {}, ""), ...columns.map((column) => {
    const unit = info(column.key).unit;
    return html("th", {}, column.short, html("span", { class: "unit" }, unit || (column.key.endsWith("uprightness") ? "−1 to 1" : " ")));
  }));
  const rows = [];
  for (let segment = 0; segment < segmentCount; segment++) {
    rows.push(html("tr", {}, html("td", { class: "segment" }, segment === 0 ? "0 head" : String(segment)),
      ...columns.map((column, i) => {
        const value = columnValues[i] ? columnValues[i][segment] : null;
        if (value === null || value === undefined) return html("td", {}, "–");
        const background = scales[i].color(value);
        return html("td", { style: `background:${background};color:${isDark(background) ? "#ffffff" : "#0b0b0b"}`,
          title: `${column.short}, segment ${segment}: ${withUnit(value, info(column.key).unit)}` },
          number(value));
      })));
  }
  return html("div", { class: "scroll" }, html("table", { class: "profile" }, html("thead", {}, head), html("tbody", {}, ...rows)));
}

function table(headings, rows, numericFrom = 1, classes = []) {
  const head = headings.length ? html("thead", {}, html("tr", {}, ...headings.map((text, i) =>
    html("th", i >= numericFrom ? { class: "number" } : {}, text)))) : null;
  const body = html("tbody", {}, ...rows.map((cells, r) => html("tr", {}, ...cells.map((cell, i) =>
    html("td", { class: [i >= numericFrom ? "number" : "", (classes[r] || [])[i] || ""].join(" ").trim() }, cell)))));
  return html("div", { class: "card scroll" }, html("table", {}, head, body));
}

function factsTable(facts) {
  const rows = Object.entries(facts).map(([key, value]) => {
    let text = value;
    if (Array.isArray(value)) text = value.join(", ");
    else if (value && typeof value === "object") text = Object.entries(value).map(([k, v]) => `${k} = ${JSON.stringify(v)}`).join("; ") || "nothing";
    return [humanise(key), String(text)];
  });
  return table([], rows, 99);
}

// Every setting; those the file set itself are marked.
function settingsTable(settings, setKeys) {
  const rows = [], classes = [];
  (function walk(values, prefix) {
    for (const [key, value] of Object.entries(values)) {
      if (value && typeof value === "object" && !Array.isArray(value)) walk(value, `${prefix}${key}.`);
      else {
        const isSet = setKeys.has(`${prefix}${key}`);
        rows.push([`${prefix}${key}`, Array.isArray(value) ? `[${value.join(", ")}]` : String(value), isSet ? "set" : "default"]);
        classes.push(isSet ? ["set", "set", "set"] : []);
      }
    }
  })(settings, "");
  return table(["Setting", "Value", "From"], rows, 99, classes);
}

// The settings summarised as chips; setKeys holds the dotted keys to highlight.
function settingChips(settings, setKeys, note) {
  const chips = [];
  for (const chip of SETTING_CHIPS) {
    let text;
    try { text = chip.text(settings); } catch (error) { continue; }  // a setting this run does not have
    if (!text) continue;  // a setting left at a value that needs no chip
    const isSet = [...setKeys].some((key) => chip.keys.some((prefix) => key === prefix || key.startsWith(`${prefix}.`)));
    chips.push(html("span", { class: `chip${isSet ? " set" : ""}` }, text));
  }
  return [html("div", { class: "chips" }, ...chips), setKeys.size ? html("p", { class: "chips-note" }, note) : html("p", { class: "chips-note" }, "")];
}

function section(number, spec, ...content) {
  return html("section", spec.minor ? { class: "minor" } : {},
    html("h2", {}, html("span", { class: "number" }, String(number)), spec.title),
    spec.intro ? html("p", { class: "note" }, spec.intro) : null,
    ...content);
}

function detailsBlock(...content) {
  return html("details", { class: "more" },
    html("summary", {}, html("span", { class: "when-closed" }, "Show details ▾"), html("span", { class: "when-open" }, "Hide details ▴")),
    ...content);
}

// =============================================================================
// 6. The training report.
// =============================================================================

function trainingReport(root) {
  const log = data.log;
  const settings = data.settings;
  const sessions = data.sessions || [];
  const x = log.map((record) => record.transitions);
  const stepsPerCycle = log.length ? log[0].transitions / log[0].cycle : 1;
  const cycleAt = (transitions) => Math.round(transitions / stepsPerCycle);
  const used = new Set();
  // One episode length in windows, and the windows over which each window's
  // episode values are taken: the last span of windows, all in the same
  // training session, since a resumed session starts new episodes.
  const windowSteps = settings.interaction_loop.rollout_window_steps;
  const span = Math.max(1, Math.ceil(settings.environment.max_episode_steps / windowSteps));
  const episodeCounts = log.map((record) => raw(record, "episodes.episode_ended") || 0);
  const sessionStarts = sessions.map((session) => session.first_cycle);
  const spanStart = (index) => {
    const sessionStart = Math.max(0, ...sessionStarts.filter((first) => first < log[index].cycle));
    const first = index - span + 1;
    return first >= 0 && log[first].cycle > sessionStart ? first : null;
  };
  const overSpan = (values) => values.map((_, index) => {
    const first = spanStart(index);
    return first === null ? null : weightedMeanOfValues(values.slice(first, index + 1), episodeCounts.slice(first, index + 1));
  });
  const series = (key) => {
    used.add(key);
    info(key).uses.forEach((source) => used.add(source));
    const values = log.map((record) => shown(record, key));
    return isEpisodeMean(key) ? overSpan(values) : values;
  };
  const simulation = settings.environment.simulation;
  const worldSteps = simulation.world_count * windowSteps;
  // Episode values are already means over an episode length of windows.
  const smoothFor = (key) => {
    const category = key.startsWith("report.") ? (key === "report.reward_per_step" ? "step_facts" : "episodes") : key.split(".")[0];
    return category === "step_facts" && worldSteps < SMOOTH_BELOW.step_facts;
  };
  // Blocks of whole episode lengths: the windows of cycles k·span + 1 to
  // (k + 1)·span, all in one training session. All worlds start together, so
  // in each block every world ends at least one episode; the first and the
  // last block are what "first" and "last" mean.
  const indexOfCycle = new Map(log.map((record, index) => [record.cycle, index]));
  const blocks = [];
  const lastCycle = log.length ? log[log.length - 1].cycle : 0;
  for (let start = 1; start + span - 1 <= lastCycle; start += span) {
    const indices = Array.from({ length: span }, (_, i) => indexOfCycle.get(start + i));
    const resumedInside = sessionStarts.some((first) => first >= start && first <= start + span - 2);
    if (indices.every((index) => index !== undefined) && !resumedInside) blocks.push(indices);
  }
  const firstSpan = blocks[0] || [], lastSpan = blocks[blocks.length - 1] || [];
  const blockLabel = (indices) => `cycles ${log[indices[0]].cycle}–${log[indices[indices.length - 1]].cycle}`;
  // A block's windows, each counted by the episodes that ended in it.
  const blockSample = (indices) => recordSample(indices.map((i) => log[i]), indices.map((i) => episodeCounts[i]));
  // The first and the last block, to compare; only the last while they are one.
  const moments = !lastSpan.length ? [] : firstSpan === lastSpan ? [["Last", lastSpan, "var(--series-1)"]]
    : [["First", firstSpan, "var(--baseline-1)"], ["Last", lastSpan, "var(--series-1)"]];
  // Where a later training session resumed the run.
  const markers = sessions.slice(1).map((session, index) => ({ x: session.first_cycle * stepsPerCycle,
    label: `Session ${index + 2} started at cycle ${session.first_cycle} (${session.started})` }));
  const context = { x, log, series, smoothFor, markers, cycleAt, settings, sessions, span, firstSpan, lastSpan, blocks,
    blockLabel, blockSample, moments, used, episodeCounts,
    hover: (c) => `cycle ${cycleAt(c)} · ${count(c)} steps` };

  // Header: what the run is, how far it got, and its settings.
  const last = log[log.length - 1];
  const trainingSeconds = log.reduce((sum, r) => sum + (r.timing.collecting_seconds || 0) + (r.timing.learning_seconds || 0), 0);
  const episodes = log.reduce((sum, r) => sum + (raw(r, "episodes.episode_ended") || 0), 0);
  root.append(html("h1", {}, data.title), html("p", { class: "status" }, last
    ? `Training run · cycle ${last.cycle} of ${settings.interaction_loop.update_cycles} · ${count(last.transitions)} steps · ` +
      `${count(episodes)} episodes · ${duration(trainingSeconds)} of training` +
      (sessions.length > 1 ? ` in ${sessions.length} sessions` : "")
    : "Training run · nothing logged yet"));
  const written = new Set(sessions.flatMap((session) => session.settings_written || []));
  root.append(...settingChips(settings, written, "Highlighted: set in the run's configuration files; the others are defaults."));
  if (!log.length) return;
  if (!blocks.length) {
    root.append(html("p", { class: "warning" }, `The episode values need one full episode length of windows (${span}); this run has ${log.length}. ` +
      "Episodes end at the target or at the time limit, so until then only the early arrivals have ended. The values measured at every step are shown already."));
  }
  series("learning.learning_rate");  // charted only when it changes; the chips give it otherwise

  // Results, learning, behaviour, and the run, as the layout says.
  TRAINING_LAYOUT.forEach((layout, index) => {
    const spec = layout.tiles ? { ...layout, intro: RESULTS_INTRO(span, span * windowSteps) } : layout;
    const content = spec.tiles ? [trainingTiles(context)] : [];
    for (const row of spec.rows) {
      const items = row.filter((item) => !item.onlyIf || item.onlyIf(settings));
      const autoWidth = `w${Math.floor(12 / items.length)}`;
      content.push(html("div", { class: "row" }, ...items.map((item) => trainingCard(item.width === "auto" ? { ...item, width: autoWidth } : item, context))));
    }
    root.append(section(index + 1, spec, ...content));
  });

  // Details: physics, per-segment heatmaps, everything else, tables, settings.
  const details = [];
  for (const group of TRAINING_DETAILS) {
    details.push(html("h3", { class: "group" }, group.title), group.intro ? html("p", { class: "note" }, group.intro) : null);
    details.push(html("div", { class: "row" }, ...group.cards.map((item) => trainingCard(item, context))));
  }
  const remaining = Object.keys(DESCRIPTIONS).filter((key) => !used.has(key));
  if (remaining.length) {
    details.push(html("h3", { class: "group" }, "Other values"), html("p", { class: "note" }, "Everything else the run logged."));
    details.push(html("div", { class: "row" }, ...remaining.map((key) => genericCard(key, context))));
  }
  details.push(html("h3", { class: "group" }, "Every value at the start and at the end"),
    html("p", { class: "note" }, "Means of the first and last few windows; episode values over the first and the last full episode length of windows. Per-segment values are averaged over the segments."),
    valuesTable(log, series));
  if (sessions.length) {
    details.push(html("h3", { class: "group" }, "Training sessions"), table(["Started", "From cycle", "Configuration file", "Code version", "Device"],
      sessions.map((s) => [s.started, String(s.first_cycle), s.configuration_file, s.git_commit || "unknown", s.device]), 99));
  }
  details.push(html("h3", { class: "group" }, "Run"), factsTable(data.run_facts),
    html("h3", { class: "group" }, "Settings"), settingsTable(settings, written));
  root.append(detailsBlock(...details));
}

// The headline numbers: each over the last episode length of windows, with its
// value over the first.
function trainingTiles(context) {
  const { settings, firstSpan, lastSpan, blockSample, used } = context;
  RESULT_TILES.forEach((tile) => tile.keys.forEach((key) => used.add(key)));
  const last = lastSpan.length ? blockSample(lastSpan) : null;
  const first = firstSpan.length && firstSpan !== lastSpan ? blockSample(firstSpan) : null;
  return html("div", { class: "tiles", style: `--tile-count:${RESULT_TILES.length}` }, ...RESULT_TILES.map((tile) => statTile({
    title: tile.title, about: tile.about(settings), keys: tile.keys, unit: tile.unit, better: tile.better,
    value: last ? tile.value(last, settings) : null,
    comparisons: first ? [{ name: "first", value: tile.value(first, settings) }] : [],
    notes: last ? [tile.note(last, settings)] : [] })));
}

function trainingCard(item, context) {
  const { x, log, series, smoothFor, markers, hover } = context;
  if (item.kind === "column") return html("div", { class: item.width, style: "display:grid;gap:14px;align-content:start" },
    ...item.cards.map((inner) => trainingCard({ ...inner, chartWidth: CHART_WIDTH[item.width] }, context)));
  const width = item.chartWidth || CHART_WIDTH[item.width] || 420;
  const metric = item.key ? info(item.key) : null;
  const common = { size: item.size, width, markers, hover };

  if (item.kind === "lines") {
    if (item.series) {
      const unit = info(item.series[0].key).unit;
      return card({ ...item, keys: item.series.map((s) => s.key) }, legend(item.series.map((s) => s.name), item.series.map((s) => s.color)),
        lineChart(x, item.series.map((s) => ({ name: s.name, color: s.color, values: series(s.key), smooth: smoothFor(s.key) })),
          { ...common, unit, fillBetween: item.fillBetween }));
    }
    const values = series(item.key);
    if (!metric.compute && !log.some((record) => raw(record, item.key) !== null)) return card(item, empty("Not logged by this run"));
    if (values.every((v) => v === null)) return card(item, empty(`Needs one full episode length of windows (${context.span})`));
    return card(item, lineChart(x, [{ name: metric.label, values, color: SERIES[0], smooth: smoothFor(item.key) }], { ...common, unit: metric.unit, range: metric.range }));
  }

  if (item.kind === "stack") {
    if (item.parts) {  // separate values that add up
      const parts = item.parts.map((key, i) => ({ name: info(key).label, values: series(key), color: SERIES[i] }));
      return card({ ...item, keys: item.parts }, legend(parts.map((p) => p.name), parts.map((p) => p.color)),
        stackChart(x, parts, { ...common, unit: info(item.parts[0]).unit }));
    }
    const values = series(item.key);  // one value's parts, averaged over the segments
    const parts = metric.parts.map((name, part) => ({ name, color: partColor(name, part),
      values: values.map((v) => overall(v, part)) }));
    series("report.reward_per_step");  // the line drawn is this value, so it is placed
    return card({ ...item, subtitle: item.subtitle || "Per step, mean over segments; the line is their sum" },
      legend([...parts.map((p) => p.name), item.totalName], [...parts.map((p) => p.color), "var(--ink)"]),
      stackChart(x, parts, { ...common, unit: metric.unit, smooth: smoothFor(item.key), totalName: item.totalName }));
  }

  if (item.kind === "heatmap") {
    const rows = transpose(series(item.key).map((v) => perSegment(v, item.part)));
    const scale = colorScale(rows.flat(), metric.unit, metric.range, betterWay(metric, item.part));
    return card(item, heatmap(x, rows, { unit: metric.unit, size: item.size, scale, width }), colorKey(scale, metric.unit, item.size));
  }

  if (item.kind === "distribution") {
    const label = binLabeller(item.key);
    const counts = log.map((record) => raw(record, item.key));
    if (!sampleOf(counts)) return card({ ...item, subtitle: "" }, empty("Not logged by this run"));
    // Rows are bins, the highest at the top; each cell is its share of that window's episodes.
    const bins = metric.edges.length - 1;
    const rows = Array.from({ length: bins }, (_, r) => bins - 1 - r).map((bin) => counts.map((c) => {
      if (c === null) return null;
      const total = c.reduce((a, b) => a + b, 0);
      return total ? (100 * c[bin]) / total : null;
    }));
    const largest = Math.max(1, ...rows.flat().filter((v) => v !== null));
    const surface = cssColor("--surface");
    const binColor = (row) => {
      const position = (bins - 1 - row) / (bins - 1);
      return qualityColor(metric.better === "lower" ? 1 - position : position);
    };
    const shown = new Set([0, Math.floor(bins / 2), bins - 1]);
    const rowLabels = rows.map((_, r) => (shown.has(r) ? label(metric.edges[bins - 1 - r]) : ""));
    return card({ ...item, subtitle: "Each column: one window's episodes. Red bins are bad, blue good; the stronger the colour, the more episodes" },
      heatmap(x, rows.map((row) => row.map((v) => v || null)), { unit: "%", size: "small", width, rowLabels, left: 44, rowGap: 0,
        rowHeight: Math.max(5, Math.round(120 / bins)), rowName: (r) => binRange(metric.edges, bins - 1 - r, label),
        cellColor: (value, row) => mixColors(surface, binColor(row), 0.2 + (0.8 * value) / largest) }));
  }

  if (item.kind === "endings") {
    const { key, classes } = endingSource(context.settings, (k) => log.some((record) => raw(record, k) !== null));
    const relative = key === "episode_distributions.ending";
    context.used.add(key);
    const spec = { ...item, title: "Where episodes ended", keys: [key],
      subtitle: relative
        ? `Every episode of each episode length: arrived, ran out of time (by how much of its start distance was left), or left the range circle. Targets start ${targetRange(context.settings)} away`
        : `Every episode of each episode length: arrived, or how far from its target it ran out of time. Targets start ${targetRange(context.settings)} away`,
      about: relative
        ? "One bar per episode length of windows, holding every episode that ended in it: the share that arrived (bottom), then the episodes that ran out of time, by the share of their start distance left at the end (within a quarter, within half, closer than at the start, not closer), then the episodes whose head left the range circle. Blue is good, red bad. A bar that fills with blue from the bottom means the centipedes get to their targets."
        : "One bar per episode length of windows, holding every episode that ended in it: the share that arrived (bottom), then the episodes that ran out of time, by how far from the target their head ended. Blue is good, red bad; the grey band is about as far as targets start. A bar that fills with blue from the bottom means the centipedes get to their targets." };
    if (!log.some((record) => raw(record, key) !== null)) return card(spec, empty("Not logged by this run: older runs did not log where each episode ended"));
    if (!context.blocks.length) return card(spec, empty(`Needs one full episode length of windows (${context.span})`));
    const columns = context.blocks.map((indices) => ({ label: context.blockLabel(indices), cycle: log[indices[indices.length - 1]].cycle,
      ...endingCounts(context.blockSample(indices), classes, key) })).filter((column) => column.total > 0);
    return card(spec, legend(classes.map((c) => c.name), classes.map((c) => c.color)), shareBars(columns, classes, width));
  }

  if (item.kind === "ending_bins") {
    const { key, classes } = endingSource(context.settings, (k) => log.some((record) => raw(record, k) !== null));
    const relative = key === "episode_distributions.ending";
    const spec = { ...item, title: "Where episodes ended: first and last", keys: [key],
      subtitle: relative
        ? "Episodes of the first and the last episode length, by how they ended; the blue numbers count the last"
        : "Episodes of the first and the last episode length, by the distance at which they ended; the blue numbers count the last",
      about: `${info(key).about} The grey bars are the first episode length of training, the blue bars the last.` };
    if (!log.some((record) => raw(record, key) !== null)) return card(spec, empty("Not logged by this run"));
    if (!context.blocks.length) return card(spec, empty(`Needs one full episode length of windows (${context.span})`));
    const edges = info(key).edges;
    const mm = (edge) => number(edge * 1000);
    const labels = relative ? classes.map((c) => c.name) : edges.slice(0, -1).map((edge, bin) => (bin === 0
      ? (context.settings.environment.target.arrival_radius_m === 0.001 ? "arrived" : `under ${mm(edges[1])} mm`)
      : bin === edges.length - 2 ? `${mm(edge)} mm or more` : `${mm(edge)}–${mm(edges[bin + 1])} mm`));
    const groups = context.moments.map(([, indices, color]) => {
      const values = context.blockSample(indices).counts(key);
      return { name: context.blockLabel(indices), color, values, total: values.reduce((a, b) => a + b, 0) };
    });
    return card(spec, legend(groups.map((g) => `${g.name}: ${count(g.total)} episodes`), groups.map((g) => g.color)),
      horizontalBars(labels, groups, width));
  }

  if (item.kind === "arrival_times") {
    context.used.add("episode_distributions.length_steps");
    const spec = { ...item, subtitle: "The episodes that arrived, by how long they took, fastest first; grey the first episode length, blue the last, which the numbers count",
      about: "The episodes that reached their target, counted by how long they took, in seconds of simulated time, the fastest at the top. Bars that move toward the top mean arrivals get faster. Episodes that ran out of time are left out." };
    if (!context.blocks.length) return card({ ...spec, title: "How long arrivals took" }, empty(`Needs one full episode length of windows (${context.span})`));
    const groups = context.moments.map(([, indices, color]) => ({ name: context.blockLabel(indices), color, sample: context.blockSample(indices) }));
    return arrivalTimesCard(spec, groups, context.settings, groups.length - 1, "Not logged by this run");
  }

  if (item.kind === "body_table") {
    PROFILE_COLUMNS.forEach((column) => series(column.key));
    const spec = { ...item, subtitle: "Average over one episode length of windows, one row per segment; both views share their colours, so switching shows the change" };
    if (!context.blocks.length) return card({ ...spec, title: "The body, segment by segment" }, empty(`Needs one full episode length of windows (${context.span})`));
    const views = context.moments.map(([name, indices]) => ({ name: `${name} episode length · ${context.blockLabel(indices)}`, sample: context.blockSample(indices) }));
    return bodyTableCard(spec, views, views.length - 1);
  }

  if (item.kind === "stat") {
    series(item.key);
    const at = (indices) => (indices.length ? sampleValue(context.blockSample(indices), item.key, item.part) : null);
    const compare = context.firstSpan.length && context.firstSpan !== context.lastSpan;
    return statTile({ title: item.title || metric.label, about: item.about || metric.about, keys: [item.key], unit: metric.unit,
      value: at(context.lastSpan), comparisons: compare ? [{ name: "first", value: at(context.firstSpan) }] : [],
      better: item.better, notes: [item.note], small: true, width: item.width });
  }

  if (item.kind === "run_stats") {
    ["timing.collecting_seconds", "timing.learning_seconds", "timing.transitions_per_second"].forEach((key) => context.used.add(key));
    const startUp = new Set(context.sessions.map((session) => session.first_cycle + 1));
    const steady = log.filter((record) => !startUp.has(record.cycle));
    const collecting = median(steady.map((r) => r.timing.collecting_seconds)), learning = median(steady.map((r) => r.timing.learning_seconds));
    const speed = median(steady.map((r) => r.timing.transitions_per_second));
    const total = log.reduce((sum, r) => sum + (r.timing.collecting_seconds || 0) + (r.timing.learning_seconds || 0), 0);
    const episodes = context.episodeCounts.reduce((a, b) => a + b, 0);
    const stats = [
      { title: "Per update cycle", value: collecting === null ? null : collecting + learning, unit: "s",
        note: `collecting ${withUnit(collecting, "s")}, learning ${withUnit(learning, "s")}`,
        about: "The typical seconds one update cycle took: collecting its window (acting, simulating, storing) and learning from it. Medians, without each session's first window, which includes start-up." },
      { title: "Simulation speed", value: speed, unit: "steps/s", note: "world steps per second while collecting",
        about: "World steps collected per second while collecting, the median over the windows without each session's first." },
      { title: "Training time", text: duration(total), note: `${count(log.length)} update cycles`,
        about: "The time spent collecting and learning, added up over every window of every session." },
      { title: "Episodes", text: count(episodes), note: `${count(log[log.length - 1].transitions)} world steps`,
        about: "Every episode that ended during training, by arriving or by running out of time." },
    ];
    return html("div", { class: `tiles in-row ${item.width}`, style: `--tile-count:${stats.length}` }, ...stats.map((stat) => {
      const tile = statTile({ ...stat, keys: [], value: stat.value ?? null, notes: [stat.note], small: true });
      if (stat.text) tile.querySelector(".value").textContent = stat.text;
      return tile;
    }));
  }

  if (item.kind === "health") {
    const values = series(item.key);
    const perAgent = values.map((v) => (v === null ? null : v.map((segment) => (Array.isArray(segment) ? mean(segment) : segment))));
    const band = perAgent.map((v) => (v === null ? { low: null, high: null } : { low: Math.min(...v), high: Math.max(...v) }));
    return card({ ...item, subtitle: metric.unit === "%" ? "in percent; band: the segments' range" : "Band: the segments' range" },
      lineChart(x, [{ name: metric.label, values: perAgent.map((v) => (v === null ? null : mean(v))), color: SERIES[0] }],
        { ...common, unit: metric.unit, band }));
  }

  if (item.kind === "speed") {
    const values = series(item.key);
    const startUp = new Set(context.sessions.map((session) => session.first_cycle + 1));
    const isStartUp = log.map((record) => startUp.has(record.cycle));
    const steady = values.map((v, i) => (isStartUp[i] ? null : v));
    const typical = median(steady);
    return card({ ...item, subtitle: `Median ${typical === null ? "–" : count(typical)} steps/s, without each session's first window` },
      legend(["steps per second", "first window of a session, with start-up"], ["var(--series-1)", "var(--baseline-1)"]),
      lineChart(x, [{ name: "steps per second", values: steady, color: SERIES[0] },
        { name: "first window", values: values.map((v, i) => (isStartUp[i] ? v : null)), color: "var(--baseline-1)", pointsOnly: true }],
        { ...common, unit: "steps/s" }));
  }

  return empty(`Unknown card kind ${item.kind}`);
}

// A small card for any value: a line, or the segments' mean with their range,
// or one line per part.
function genericCard(key, context) {
  const { x, series, smoothFor, markers, hover } = context;
  const metric = info(key), values = series(key), sample = sampleOf(values);
  const spec = { key, size: "small", width: "w4" };
  if (sample === undefined) return card(spec, empty());
  const shape = shapeOf(sample);
  const options = { size: "small", unit: metric.unit, width: CHART_WIDTH.w4, markers, hover, range: metric.range };
  const smooth = smoothFor(key);
  if (shape === "single") return card(spec, lineChart(x, [{ name: metric.label, values, color: SERIES[0], smooth }], options));
  if (shape === "segments") {
    const band = values.map((v) => {
      const present = v === null ? [] : v.filter((e) => e !== null);
      return present.length ? { low: Math.min(...present), high: Math.max(...present) } : { low: null, high: null };
    });
    return card({ ...spec, subtitle: `Mean of the segments, band: their range${metric.unit ? `, in ${metric.unit}` : ""}` },
      lineChart(x, [{ name: metric.label, values: values.map((v) => (v === null ? null : mean(v))), color: SERIES[0], smooth }], { ...options, band }));
  }
  const parts = metric.parts.length ? metric.parts : sample[0].map((_, i) => `part ${i}`);
  return card({ ...spec, subtitle: `Mean over segments${metric.unit ? `, in ${metric.unit}` : ""}` },
    legend(parts, SERIES), lineChart(x, parts.map((name, part) => ({ name, color: SERIES[part % SERIES.length], smooth,
      values: values.map((v) => (v === null ? null : mean(perSegment(v, part)))) })), options));
}

function targetRange(settings) {
  const [near, far] = settings.environment.target.distance_range_m;
  return `${number(near * 1000)}–${number(far * 1000)} mm`;
}

function transpose(values) {
  const sample = sampleOf(values);
  if (!sample) return [];
  return sample.map((_, segment) => values.map((v) => (v === null ? null : v[segment])));
}

// Every value's first and last means, one row per value (and part).
function valuesTable(log, series) {
  const rows = [];
  const keys = [...Object.keys(DESCRIPTIONS), "report.reward_per_step", "report.mean_return"];
  for (const key of keys) {
    const metric = info(key), values = series(key), sample = sampleOf(values);
    if (sample === undefined) continue;
    const shape = shapeOf(sample);
    const parts = shape === "parts" ? (metric.parts.length ? metric.parts : sample[0].map((_, i) => `part ${i}`)) : [null];
    parts.forEach((part, index) => {
      const reduced = values.map((v) => (v === null ? null : shape === "single" ? v : mean(perSegment(v, shape === "parts" ? index : undefined))));
      // Episode values are already means over an episode length: the first and the last.
      const present = reduced.filter((v) => v !== null);
      const at = (moment) => (isEpisodeMean(key) ? (moment === "start" ? present[0] : present[present.length - 1]) ?? null : momentMean(reduced, moment));
      rows.push([`${metric.label}${part ? ` · ${part}` : ""}`, metric.unit, number(at("start")), number(at("end"))]);
    });
  }
  return table(["Value", "Unit", "At the start", "At the end"], rows, 2);
}

// =============================================================================
// 7. The evaluation report.
// =============================================================================

function evaluationReport(root) {
  const actors = Object.keys(data.results);
  const facts = data.run_facts;
  const settings = data.settings;
  const seedCount = facts.seeds.length;
  root.append(html("h1", {}, data.title), html("p", { class: "status" },
    `Evaluation of cycle ${facts.cycles_trained} · ${seedCount} seed${seedCount === 1 ? "" : "s"} × ${count(facts.episodes_per_seed)} episodes · ` +
    (actors.length > 1 ? `compared with ${actors.slice(1).join(" and ")}` : "no baselines")));
  const changes = Object.keys(facts.changed_from_training || {}).map((key) => `environment.${key}`);
  root.append(...settingChips(settings, new Set(changes), "Highlighted: changed for this evaluation; the others are as in training."));

  // Each actor's seeds, together and one by one. Every seed holds one episode
  // per world, each world's first.
  const seedSample = (record) => recordSample([record], [facts.episodes_per_seed]);
  const samples = actors.map((actor) => recordSample(data.results[actor], data.results[actor].map(() => facts.episodes_per_seed)));
  const seedSamples = actors.map((actor) => data.results[actor].map(seedSample));
  // Per actor and value, for the details: the mean over seeds and the seeds' range.
  const perSeed = (actor, key) => data.results[actor].map((record) => shown(record, key));
  const summary = (actor, key, reduce = (v) => v) => {
    const values = perSeed(actor, key).map((v) => (v === null ? null : reduce(v))).filter((v) => v !== null);
    return { value: mean(values), low: values.length ? Math.min(...values) : null, high: values.length ? Math.max(...values) : null };
  };
  const actorColors = actors.map((_, i) => ACTOR_COLORS[i] || SERIES[i]);
  const context = { actors, samples, seedSamples, perSeed, summary, actorColors, settings, facts };

  EVALUATION_LAYOUT.forEach((layout, index) => {
    const spec = layout.tiles ? { ...layout, intro: EVALUATION_INTRO(actors.length > 1, seedCount) } : layout;
    const content = spec.tiles ? [html("div", { class: "tiles", style: `--tile-count:${RESULT_TILES.length}` },
      ...RESULT_TILES.map((tile) => evaluationStat(tile, context)))] : [];
    for (const row of spec.rows) content.push(html("div", { class: "row" }, ...row.map((item) => evaluationCard(item, context))));
    root.append(section(index + 1, spec, ...content));
  });

  // Details: the episodes in bins, each segment's return, every value per
  // actor, the evaluation's facts, and the settings.
  const details = [];
  for (const group of EVALUATION_DETAILS) {
    details.push(html("h3", { class: "group" }, group.title), group.intro ? html("p", { class: "note" }, group.intro) : null);
    details.push(html("div", { class: "row" }, ...group.cards.map((item) => evaluationCard(item, context))));
  }
  const rows = [];
  const keys = [...Object.keys(DESCRIPTIONS), "report.reward_per_step", "report.mean_return"];
  for (const key of keys) {
    const metric = info(key);
    const sample = sampleOf(actors.flatMap((actor) => perSeed(actor, key)));
    if (sample === undefined) continue;
    const shape = shapeOf(sample);
    const parts = shape === "parts" ? (metric.parts.length ? metric.parts : sample[0].map((_, i) => `part ${i}`)) : [null];
    parts.forEach((part, index) => {
      const reduce = (v) => (shape === "single" ? v : mean(perSegment(v, shape === "parts" ? index : undefined)));
      rows.push([`${metric.label}${part ? ` · ${part}` : ""}`, metric.unit, ...actors.map((actor) => {
        const s = summary(actor, key, reduce);
        return s.low === s.high ? number(s.value) : html("span", {}, number(s.value), html("br"), html("span", { class: "range" }, `${number(s.low)} to ${number(s.high)}`));
      })]);
    });
  }
  details.push(html("h3", { class: "group" }, "Every value"),
    html("p", { class: "note" }, "Mean over seeds, with the lowest to highest seed below; per-segment values are averaged over the segments."),
    table(["Value", "Unit", ...actors], rows, 2),
    html("h3", { class: "group" }, "Evaluation"), factsTable(facts),
    html("h3", { class: "group" }, "Settings"), settingsTable(settings, new Set(changes)));
  root.append(detailsBlock(...details));
}

// A number of an evaluation: the agents' over every seed, with the seeds'
// range, and each baseline's below it. "tile" is as in RESULT_TILES.
function evaluationStat(tile, context, { small = false, width = "" } = {}) {
  const { actors, samples, seedSamples, settings } = context;
  const valueOf = (sample) => tile.value(sample, settings);
  const seeds = seedSamples[0].map(valueOf).filter((value) => value !== null);
  let spread = null;
  if (seeds.length > 1) {
    const [low, high] = [Math.min(...seeds), Math.max(...seeds)].map((value) => withUnit(value, tile.unit));
    spread = low === high ? "the same on every seed" : `seeds ${low} to ${high}`;
  }
  return statTile({ title: tile.title, about: tile.about(settings), keys: tile.keys, unit: tile.unit, better: tile.better,
    value: valueOf(samples[0]), notes: [tile.note(samples[0], settings), spread],
    comparisons: actors.slice(1).map((name, i) => ({ name, value: valueOf(samples[i + 1]) })), versus: true, small, width });
}

function evaluationCard(item, context) {
  const { actors, samples, seedSamples, perSeed, summary, actorColors, settings } = context;
  if (item.kind === "column") return html("div", { class: item.width, style: "display:grid;gap:14px;align-content:start" },
    ...item.cards.map((inner) => evaluationCard({ ...inner, chartWidth: CHART_WIDTH[item.width] }, context)));
  const width = item.chartWidth || CHART_WIDTH[item.width] || 420;
  const metric = item.key ? info(item.key) : null;
  const several = actors.length > 1;

  if (item.kind === "stat") {
    return evaluationStat({ title: item.title || metric.label, about: () => item.about || metric.about, keys: [item.key], unit: metric.unit,
      better: item.better, value: (sample) => sampleValue(sample, item.key, item.part), note: () => item.note }, context, { small: true, width: item.width });
  }

  if (item.kind === "endings") {
    const { key, classes } = endingSource(settings, (k) => samples.some((sample) => sample.counts(k) !== null));
    const relative = key === "episode_distributions.ending";
    const spec = { ...item, title: "Where episodes ended", keys: [key],
      subtitle: relative
        ? `${several ? "Each actor's" : "The agents'"} episodes: arrived, ran out of time (by how much of its start distance was left), or left the range circle. Targets start ${targetRange(settings)} away`
        : `${several ? "Each actor's" : "The agents'"} episodes: arrived, or how far from its target the head ran out of time. Targets start ${targetRange(settings)} away`,
      about: (relative
        ? "One bar per actor, holding its episodes of every seed: the share that arrived (left), then the episodes that ran out of time, by the share of their start distance left at the end, then the episodes whose head left the range circle. Blue is good, red bad."
        : "One bar per actor, holding its episodes of every seed: the share that arrived (left), then the episodes that ran out of time, by how far from the target their head ended. Blue is good, red bad, and grey about as far as the targets of training start.") +
        (context.facts.seeds.length > 1 ? " The thin bars under it are the seeds one by one: alike, they show that the result holds on every seed." : "") };
    if (samples.every((sample) => sample.counts(key) === null)) return card(spec, empty("Not recorded by this evaluation: older evaluations did not record where each episode ended"));
    const rows = actors.flatMap((actor, i) => [{ label: actor, ...endingCounts(samples[i], classes, key) },
      ...(seedSamples[i].length > 1 ? seedSamples[i].map((sample, k) => ({ label: `seed ${data.results[actor][k].seed}`, minor: true, ...endingCounts(sample, classes, key) })) : [])])
      .filter((row) => row.total > 0);
    return card(spec, legend(classes.map((c) => c.name), classes.map((c) => c.color)), shareRows(rows, classes, width));
  }

  if (item.kind === "arrival_times") {
    const spec = { ...item, subtitle: `The episodes that arrived, by how long they took, fastest first; the blue numbers count the agents'`,
      about: "The episodes that reached their target, counted by how long they took, in seconds of simulated time, the fastest at the top, every seed together. Episodes that ran out of time are left out." };
    const groups = actors.map((name, i) => ({ name, color: actorColors[i], sample: samples[i] }));
    return arrivalTimesCard(spec, groups, settings, 0, "Not recorded by this evaluation");
  }

  if (item.kind === "reward_terms") {
    const key = "step_facts.reward_parts", parts = info(key).parts;
    const spec = { ...item, key, title: "Where the reward comes from",
      subtitle: "Reward per step by term, mean over segments, steps, and seeds; the mark across each bar is their sum",
      about: "The average reward per step, split into its terms and averaged over the segments, the steps, and the seeds: the terms above zero (arrival, and progress when the head came closer to the target) to the right, the costs to the left. The mark across each bar and the number are their sum, the reward per step. Next to the baselines, it shows which terms make the difference." };
    const rows = actors.map((label, i) => {
      const values = samples[i].stepMean(key);
      return { label, values: values === null ? null : parts.map((_, part) => overall(values, part)) };
    }).filter((row) => row.values !== null);
    if (!rows.length) return card(spec, empty());
    const colors = parts.map((name, part) => partColor(name, part));
    return card(spec, legend([...parts, "sum"], [...colors, "var(--ink)"]),
      termRows(rows, parts.map((name, part) => ({ name, color: colors[part] })), width, info(key).unit));
  }

  if (item.kind === "body_table") {
    const spec = { ...item, subtitle: `Average over the steps of every seed, one row per segment${several ? "; the actors share each column's colours, so switching compares them" : ""}` };
    return bodyTableCard(spec, actors.map((name, i) => ({ name, sample: samples[i] })), 0);
  }

  if (item.kind === "histogram") {
    const label = binLabeller(item.key);
    const summed = samples.map((sample) => sample.counts(item.key));
    if (summed.every((c) => c === null)) return card({ ...item, subtitle: "" }, empty("Not recorded by this evaluation"));
    const shown = actors.map((name, i) => {
      const counts = summed[i] || [], total = counts.reduce((a, b) => a + b, 0);
      return { name, color: actorColors[i], counts, total, shares: counts.map((n) => (total ? (100 * n) / total : 0)) };
    });
    const markEdge = item.key.endsWith("length_steps") ? { edge: settings.environment.max_episode_steps, label: "time limit" } : null;
    return card({ ...item, subtitle: "Share of each actor's episodes in each bin" },
      several ? legend(actors, actorColors) : null,
      histogramChart(metric.edges, shown, { width, label, markEdge }));
  }

  if (item.kind === "segments") {
    // Grouped bars: one group per segment, one bar per actor.
    const sample = sampleOf(actors.flatMap((actor) => perSeed(actor, item.key)));
    if (sample === undefined) return card(item, empty());
    const labels = sample.map((_, s) => (s === 0 ? "0 head" : String(s)));
    const values = (actor) => labels.map((_, i) => summary(actor, item.key, (v) => v[i]).value);
    return card(item, several ? legend(actors, actorColors) : null,
      groupedBars(labels, actors.map((actor, i) => ({ name: actor, color: actorColors[i], values: values(actor) })), metric.unit, width));
  }
  return empty(`Unknown card kind ${item.kind}`);
}

// =============================================================================

function render() {
  const root = document.getElementById("report");
  root.replaceChildren();
  nextId = 0;
  document.title = data.title;
  (data.kind === "training" ? trainingReport : evaluationReport)(root);
}

render();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
</script>
</body>
</html>
