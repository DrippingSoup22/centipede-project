[run]
mode = "train"
name = "spine_03_movement_2"
seed = 1
checkpoint_every_cycles = 16
report = true
runs_folder = "/kaggle/working"
start_from = "runs/2026-10-07_2221_baseline_stage2"
record_every_episodes = 1
record_levels = 4
record_worlds = "all"
record_selection = "ranked"

[environment]
max_episode_steps = 256
observation_radius = 1
spine_control = true

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 64
gpu_solver = "newton"
contacts_per_world = 128
constraints_per_world = 512
start_heading_range_deg = 0.0

[environment.target]
distance_range_m = [
    0.03,
    0.06,
]
bearing_range_deg = [
    -30.0,
    30.0,
]
arrival = "head"
range_circle_ratio = 2.5

[environment.rewards]
arrival_reward = 1.0
step_cost_parts = 2.0
body_contact_cost_parts = 3.0
leg_contact_cost_parts = 1.0
movement_cost_parts = 2.0
random_command_movement_deg = 25.0
cost_budget_parts = 8.0
head_progress_ratio = 1.0
follower_progress_share = 1.0
distance_ratio_epsilon_m = 1e-06

[agents]
device = "cuda"
hidden_layers = [
    64,
    64,
]
initial_action_std = 0.5
optimizer = "adam"
learning_rate = 0.0003
learning_rate_schedule = "constant"
final_learning_rate = 2.9999999999999997e-05
weight_decay = 0.0
momentum = 0.9
normaliser_epsilon = 1e-08
observation_clip = 10.0

[agents.ppo]
discount = 0.9972960560854701
gae_lambda = 0.95
clip_ratio = 0.2
update_epochs = 4
minibatch_size = 512
max_gradient_norm = 0.5
entropy_coefficient = 0.001

[interaction_loop]
rollout_window_steps = 64
update_cycles = 32
