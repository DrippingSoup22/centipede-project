# Reward study, 2026-10-09 (plan.md, Stage 8.4; results/reward_study/),
# decided with the user: one reward component at a time is added to this
# baseline, and everything else stays as it is here, so that the comparisons
# show what each component changes. Every condition runs with two seeds in
# one Kaggle session:
#
#   python scripts/kaggle_gpu.py run configs/reward_study/01_baseline.toml --seeds 1 2
#
# Fixed for the whole study: model v3 with spine control (every segment but
# the rear commands the spine joint behind it); targets 30-60 mm within 30
# degrees, arrival under the head, range circle 2.5, 256-step episodes; 64
# worlds, rollout window 64, minibatch 512, epochs 4, the agents' default
# networks and PPO settings; 32 update cycles from the standing prototype.
#
# Baseline reward (docs/environment.md, Rewards, rules R0-R4): arrival 1; the
# head's progress, shared by every segment; a step cost, body contact, and leg
# contact, the cost budget split 2 : 3 : 1; no movement cost. The same reward
# as configs/far_targets/01 (spine passive) and the same body as
# configs/spine_movement/02-03 (with a movement cost).
#
# Hypothesis: none; this is the reference. Expected near far_01's first 32
# cycles (arrivals 14% -> 23%, a straight walk's luck is 18%), with the
# spine's random bend (about 8 degrees) and legs touching somewhat more, as in
# spine_02 and spine_03.

[run]
runs_folder = "/kaggle/working"  # set by kaggle_gpu.py
mode = "train"
name = "reward_01_baseline_seed2"  # set by kaggle_gpu.py
seed = 2  # set by kaggle_gpu.py
checkpoint_every_cycles = 16
start_from = "runs/2026-10-07_2221_baseline_stage2"

[environment]
max_episode_steps = 256
spine_control = true

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 64

[environment.target]
distance_range_m = [0.030, 0.060]
bearing_range_deg = [-30, 30]
arrival = "head"
range_circle_ratio = 2.5

[environment.rewards]
arrival_reward = 1
step_cost_parts = 2
body_contact_cost_parts = 3
leg_contact_cost_parts = 1
movement_cost_parts = 0
head_progress_ratio = 1
follower_progress_share = 1

[agents]
device = "cuda"

[agents.ppo]
minibatch_size = 512

[interaction_loop]
rollout_window_steps = 64
update_cycles = 32
