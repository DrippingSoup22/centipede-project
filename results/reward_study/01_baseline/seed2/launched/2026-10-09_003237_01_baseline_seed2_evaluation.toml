# Evaluation after each run of the reward study: kaggle_gpu.py replaces
# source with the run's folder. One seed of 32 worlds, each world's first
# episode, up to the run's episode length; the agents act with their policy's
# mean action. The zero and random baselines give the report's reference rows
# (standing still and random commands) under each condition's own reward.

[run]
mode = "evaluate"
source = "/kaggle/working/2026-10-08_2233_reward_01_baseline_seed2"

[evaluation]
seeds = [101]
episodes_per_seed = 32
baselines = ["zero", "random"]
