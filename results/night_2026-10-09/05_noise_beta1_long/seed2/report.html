<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centipede run report</title>
<!--
  The page of a run report. report.py replaces REPORT_DATA below with the run's
  data, and the script draws everything from it.

  To change the report, edit the start of the script:
    METRICS            what each value is called, its unit, and its explanation;
    SETTING_CHIPS      the settings summarised under the title;
    TRAINING_LAYOUT    which values the training report shows, where, and how;
    EVALUATION_LAYOUT  the same for the evaluation report.
  Values that no layout places are shown under "Show details" automatically.
  docs/configuration.md explains which chart is used for which question.
-->
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10); --middle: #f0efec; --chip: #eef4fc; --chip-ink: #184f95;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    --series-5: #e87ba4; --series-6: #008300; --baseline-1: #898781; --baseline-2: #c3c2b7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --muted: #898781; --grid: #2c2c2a; --axis: #383835;
      --border: rgba(255, 255, 255, 0.10); --middle: #383835; --chip: #142a45; --chip-ink: #9ec5f4;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --series-5: #d55181; --series-6: #008300; --baseline-1: #898781; --baseline-2: #52514e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255, 255, 255, 0.10); --middle: #383835; --chip: #142a45; --chip-ink: #9ec5f4;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --baseline-1: #898781; --baseline-2: #52514e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 24px; margin: 0; font-weight: 650; overflow-wrap: anywhere; }
  .status { color: var(--ink-2); margin: 4px 0 8px; }
  .note { color: var(--ink-2); margin: 0 0 12px; max-width: 780px; }
  .warning { color: var(--ink); background: var(--middle); border-radius: 8px; padding: 8px 12px; margin: 0 0 16px; }

  /* The settings under the title: one chip per group, highlighted when set by the file. */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 4px; }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); background: var(--surface); }
  .chip.set { background: var(--chip); color: var(--chip-ink); border-color: transparent; }
  .chips-note { color: var(--muted); font-size: 11.5px; margin: 0 0 18px; }

  /* Sections: results large, learning and behaviour smaller, details hidden. */
  section { margin-top: 30px; }
  section > h2 { font-size: 18px; margin: 0 0 2px; font-weight: 650; }
  section > h2 .number { color: var(--muted); font-weight: 500; margin-right: 6px; }
  section.minor > h2 { font-size: 16px; }
  .row { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
  .w12 { grid-column: span 12; } .w8 { grid-column: span 8; } .w7 { grid-column: span 7; } .w6 { grid-column: span 6; }
  .w5 { grid-column: span 5; } .w4 { grid-column: span 4; } .w3 { grid-column: span 3; }
  @media (max-width: 900px) { .w8, .w7, .w6, .w5, .w4 { grid-column: span 12; } .w3 { grid-column: span 6; } }
  @media (max-width: 520px) { .w3 { grid-column: span 12; } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 12px; min-width: 0; }
  .card.small { padding: 10px 12px 8px; }
  .card h3 { margin: 0 0 2px; font-size: 16px; font-weight: 620; }
  .card.small h3 { font-size: 13px; }
  .card .subtitle { color: var(--ink-2); font-size: 12.5px; margin: 0 0 8px; }
  .card.small .subtitle { font-size: 11.5px; margin-bottom: 4px; }

  /* Clicking a title opens its explanation. */
  .about-button { all: unset; cursor: pointer; border-radius: 4px; }
  .about-button:hover .title-text, .about-button:focus-visible .title-text { text-decoration: underline dotted; text-underline-offset: 3px; }
  .about-button:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
  .about-mark { display: inline-block; width: 15px; height: 15px; line-height: 15px; text-align: center; border-radius: 50%;
    border: 1px solid var(--axis); color: var(--muted); font-size: 10px; font-weight: 700; margin-left: 6px; vertical-align: 2px; }
  [popover].about { max-width: min(440px, calc(100vw - 32px)); padding: 16px 18px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--surface); color: var(--ink); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); }
  [popover].about::backdrop { background: rgba(0, 0, 0, 0.12); }
  [popover].about h4 { margin: 0 0 6px; font-size: 15px; }
  [popover].about p { margin: 0 0 8px; }
  [popover].about .source { color: var(--muted); font-size: 12px; margin: 0; }

  /* Headline tiles. */
  .tiles { display: grid; grid-template-columns: repeat(var(--tile-count, 5), minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
  @media (max-width: 1000px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tiles.in-row { margin-bottom: 0; }
  .tile .label { color: var(--ink-2); font-size: 13px; }
  .tile .value { font-size: 28px; font-weight: 650; line-height: 1.15; margin-top: 2px; }
  .tile .from { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tile .others { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
  .tile svg { margin-top: 6px; }
  .tile .change { font-weight: 700; }
  .tile .change.better { color: var(--series-1); }
  .tile .change.worse { color: var(--series-2); }
  .card.small.tile .value { font-size: 22px; }
  .tile .value .unit { font-size: 15px; font-weight: 550; color: var(--ink-2); margin-left: 4px; }
  .tile .versus { border-top: 1px solid var(--grid); margin-top: 8px; padding-top: 5px; }
  .tile .versus .from { color: var(--ink-2); }

  /* Switches between two views of one card. */
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
  .toggle { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); }
  .toggle.on { background: var(--chip); color: var(--chip-ink); border-color: transparent; font-weight: 600; }
  .toggle:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--muted); font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
  svg text.label { fill: var(--ink-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 6px; color: var(--ink-2); font-size: 12px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .swatch.line { height: 3px; vertical-align: 3px; }

  /* Tables: only for looking up exact values. */
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; overflow-wrap: anywhere; }
  th { color: var(--ink-2); font-weight: 600; }
  td.number, th.number { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; overflow-wrap: normal; }
  td.set { color: var(--chip-ink); font-weight: 600; }
  .range { color: var(--muted); font-size: 11.5px; }
  .scroll { overflow-x: auto; }
  table.profile { font-size: 12px; }
  table.profile th { font-size: 11.5px; text-align: center; padding: 3px 4px; line-height: 1.2; overflow-wrap: normal; }
  table.profile th .unit { display: block; color: var(--muted); font-weight: 400; }
  table.profile td { text-align: center; padding: 4px 4px; border-bottom: 2px solid var(--surface); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.profile td.segment { text-align: right; color: var(--ink-2); background: none; padding-right: 8px; }

  /* Details: hidden until asked for. */
  details.more { margin-top: 30px; }
  details.more > summary { list-style: none; cursor: pointer; display: inline-block; padding: 9px 16px; border-radius: 8px;
    border: 1px solid var(--axis); background: var(--surface); color: var(--ink); font-weight: 600; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary .when-open { display: none; }
  details.more[open] > summary .when-open { display: inline; }
  details.more[open] > summary .when-closed { display: none; }
  details.more h3.group { font-size: 15px; margin: 22px 0 8px; }
  .empty { color: var(--muted); padding: 18px 0; text-align: center; font-size: 13px; }
</style>
</head>

    about: "How much of the starting distance to the target the head closed by the end of the episode, averaged over the episodes that ended: 100% means it reached the target, 0% that it ended as far away as it started, and below 0% that it moved away. Runs logged before this value existed show 1 − mean end distance ÷ mean start distance instead.",
    compute: (record) => {

// The settings summarised under the title. A chip is highlighted when the
// run's configuration file sets one of its "keys" (or a key inside it) itself.
const SETTING_CHIPS = [
  { keys: ["environment.simulation.backend", "environment.simulation.gpu_solver", "environment.simulation.world_count"],
    text: ({ environment: { simulation: s } }) => `${s.backend.toUpperCase()}${s.backend === "gpu" ? ` · ${s.gpu_solver}` : ""} · ${count(s.world_count)} worlds` },
  { keys: ["environment.simulation.model_path"], text: (s) => `model ${s.environment.simulation.model_path.split(/[\\/]/).pop()}` },
  { keys: ["environment.simulation.start_heading_range_deg"], text: ({ environment: { simulation: s } }) =>
    (s.start_heading_range_deg ? `starts facing ${s.start_heading_range_deg >= 180 ? "any direction" : `within ±${number(s.start_heading_range_deg)}°`}` : null) },
  { keys: ["environment.max_episode_steps"], text: (s) => {
    const seconds = s.environment.max_episode_steps * STEP_SECONDS;
    return `episodes up to ${seconds < 600 ? withUnit(seconds, "s") : duration(seconds)}`;
  } },
  { keys: ["environment.target"],
    text: ({ environment: { target: t } }) => `targets ${number(t.distance_range_m[0] * 1000)}–${number(t.distance_range_m[1] * 1000)} mm, ` +
      `${number(t.bearing_range_deg[0])}° to ${number(t.bearing_range_deg[1])}°, ` +
      // Runs before 8 October 2026's arrival under the head set the tip's radius.
      (t.arrival_radius_m !== undefined && t.arrival !== "head" ? `arrival within ${number(t.arrival_radius_m * 1000)} mm` : "arrival under the head") +
      (t.range_circle_ratio ? `, range circle ${number(t.range_circle_ratio)} × the start distance` : "") },
  { keys: ["environment.observation_radius"], text: (s) => `sees ${s.environment.observation_radius} neighbour${s.environment.observation_radius === 1 ? "" : "s"} each way` },
  // Runs before the spine could be commanded have no such setting.
  { keys: ["environment.spine_control"], text: (s) => s.environment.spine_control ? "each segment bends the spine joint behind it" : "passive spine" },
  { keys: ["environment.rewards"],
    text: ({ environment: { rewards: r } }) => {
      // Runs from before 8 October 2026 set per-step weights instead of proportions.
      if (r.step_cost_parts === undefined) return `rewards: arrival ${r.arrival_reward} · efficiency ${r.efficiency_cost} · body ${r.body_contact_cost} · legs ${r.leg_contact_cost}`;
      const movement = r.movement_cost_parts || 0;
      const used = r.body_contact_cost_parts + r.step_cost_parts + r.leg_contact_cost_parts + movement;
      // The first runs of the rules paid the followers for their own goals.
      const followers = r.follower_progress_ratio !== undefined
        ? `followers ${number(r.follower_progress_ratio)} × head, toward the segment ahead`
        : r.follower_progress_share === 1 ? "shared by the followers"
        : r.follower_progress_share === 0 ? "none for the followers" : `followers ${number(r.follower_progress_share)} of it`;
      return `rewards: arrival ${r.arrival_reward} · costs body ${number(r.body_contact_cost_parts)} : step ${number(r.step_cost_parts)} : legs ${number(r.leg_contact_cost_parts)}` +
        (movement ? ` : movement ${number(movement)}` : "") +
        `${r.cost_budget_parts !== used ? ` of ${number(r.cost_budget_parts)} parts` : ""} · progress: head ${number(r.head_progress_ratio)} × step cost, ${followers}`;
    } },
  { keys: ["interaction_loop"], text: ({ interaction_loop: l }) => `window ${count(l.rollout_window_steps)} steps · ${count(l.update_cycles)} cycles` },
  { keys: ["agents.hidden_layers", "agents.optimizer", "agents.learning_rate", "agents.learning_rate_schedule",
            "agents.final_learning_rate", "agents.weight_decay", "agents.momentum", "agents.initial_action_std"],
    text: ({ agents: a }) => {
      // Runs from before the optimizer could be chosen used Adam at a constant rate.
      const schedule = a.learning_rate_schedule && a.learning_rate_schedule !== "constant"
        ? ` → ${a.final_learning_rate} (${a.learning_rate_schedule})` : "";
      const optimizer = (a.optimizer || "adam") === "sgd" ? `SGD, momentum ${a.momentum}` : (a.optimizer === "adamw" ? "AdamW" : "Adam");
      const decay = a.weight_decay ? ` · weight decay ${a.weight_decay}` : "";
      return `network ${a.hidden_layers.join("×")} · ${optimizer}, learning rate ${a.learning_rate}${schedule}${decay} · initial spread ${a.initial_action_std}`;
    } },
  { keys: ["agents.ppo"],
    text: ({ agents: { ppo: p } }) => `PPO: ${p.update_epochs} epochs · minibatch ${count(p.minibatch_size)} · γ ${Number(p.discount.toPrecision(5))} · λ ${p.gae_lambda} · clip ${p.clip_ratio} · entropy ${p.entropy_coefficient}` },
  { keys: ["run.seed"], text: (s) => `seed ${s.run.seed}` },
];

// =============================================================================
// 2. The layouts. Each card names the values it shows and how. Card kinds, in
// both reports unless a report is named:
//   endings       where episodes ended: arrived, or how far from the target
//                 (training: one bar per episode length; evaluation: per actor)
//   ending_bins   training: the first and the last episode length, per bin
//   arrival_times how long the episodes that arrived took
//   body_table    one row per segment, with a switch between views
//   stat          one number, compared with the first episode length or the baselines
//   reward_terms  evaluation: the reward per step by term, one bar per actor
//   run_stats     training: the run's own numbers
//   lines         one or more values over training
//   stack         values that add up, stacked over training (diverging at zero)
//   heatmap       one value per segment over training (part: which part)
//   distribution  how each window's episodes spread over a value's bins
//   health        a learning value: the segments' mean, with their range
//   speed         steps per second, with each session's start-up apart
//   histogram     evaluation: how each actor's episodes spread over a value's bins
//   segments      evaluation: one value per segment, one bar per actor
//   column        cards placed on top of each other in one column
// Sizes: "large" for results, "small" for everything else.
//
// Which chart answers which question (docs/configuration.md): numbers first,
// and a chart only where it shows what a number cannot. A line for how a value
// changed over training; a stack for parts of a whole; counts of episodes for
// how they spread, so that a few that wander far away do not hide what the
// others did; a heatmap for how each segment changed; tables to look up exact
// values.
// =============================================================================

// Episode values rest on few episodes when a run has few worlds, and step
// values on few steps; their charts then draw faint points under a moving
// average. With many worlds, as on the GPU, every point is already an average
// of many, and the line is drawn as it is.
const SMOOTH_BELOW = { episodes: 100, step_facts: 10000 };

// =============================================================================
// 3. Reading values from the data.
// =============================================================================

const DESCRIPTIONS = {};    // values summarised as numbers, by "category.value"
const DISTRIBUTIONS = {};   // values counted in bins, with their edges
for (const category of data.categories) {
  for (const value of category.values) {
    const key = `${category.name}.${value.name}`;
    if (category.holds_histograms) DISTRIBUTIONS[key] = { ...value, category: category.title };
    else DESCRIPTIONS[key] = { ...value, category: category.title };
  }
}

function raw(record, key) {
  const [category, name] = key.split(".");
  const value = record[category] ? record[category][name] : undefined;
  return value === undefined ? null : value;
}

// Everything known about a value: its name, unit, scale, parts, and explanation.
function info(key) {
  const description = DESCRIPTIONS[key] || DISTRIBUTIONS[key] || {};
  const metric = METRICS[key] || {};
  const isShare = description.summary === "share";
  return {
    key,
    label: metric.label || humanise(key.split(".")[1]),
    unit: metric.unit !== undefined ? metric.unit : (isShare ? "%" : description.unit || ""),
    scale: metric.scale !== undefined ? metric.scale : (isShare ? 100 : 1),
    about: metric.about || (description.meaning ? stripShape(description.meaning) + "." : ""),
    parts: (description.parts || []).map(humanise),
    compute: metric.compute,
    uses: metric.uses || [],
    source: metric.source,
    edges: description.histogram_edges || [],
    range: metric.range || null,
    better: metric.better || null,
  };
}

// A record's value in display units: a number, a list per segment, or a list
// per segment of lists per part. Missing values are null.
function shown(record, key) {
  const metric = info(key);
  if (metric.compute) return metric.compute(record);
  return scaled(raw(record, key), metric.scale);
}

function scaled(value, scale) {
  if (value === null) return null;
  return Array.isArray(value) ? value.map((item) => scaled(item, scale)) : value * scale;
}

function mean(values) {
  const present = values.filter((value) => value !== null && value !== undefined);
  return present.length ? present.reduce((a, b) => a + b, 0) / present.length : null;
}

function median(values) {
  const present = values.filter((value) => value !== null && Number.isFinite(value)).sort((a, b) => a - b);
  if (!present.length) return null;
  const middle = Math.floor(present.length / 2);
  return present.length % 2 ? present[middle] : (present[middle - 1] + present[middle]) / 2;
}

// The element-wise mean of several values of the same shape, each counted
// with its weight; values without weight or value are left out.
function weightedMeanOfValues(values, weights) {
  const kept = values.map((value, i) => [value, weights[i]]).filter(([value, weight]) => value !== null && weight > 0);
  const total = kept.reduce((sum, [, weight]) => sum + weight, 0);
  if (!total) return null;
  const combine = (items) => (Array.isArray(items[0][0])
    ? items[0][0].map((_, index) => combine(items.map(([value, weight]) => [value[index], weight])))
    : items.filter(([value]) => value !== null).reduce((sum, [value, weight]) => sum + value * weight, 0) /
      items.filter(([value]) => value !== null).reduce((sum, [, weight]) => sum + weight, 0));
  return combine(kept);
}

// The element-wise mean of several values of the same shape.
function meanOfValues(values) {
  const present = values.filter((value) => value !== null);
  if (!present.length) return null;
  if (!Array.isArray(present[0])) return mean(present);
  return present[0].map((_, index) => meanOfValues(present.map((value) => value[index])));
}

// One number per segment, picking a part of values that have parts.
function perSegment(value, part) {
  if (value === null) return null;
  return part === undefined ? value : value.map((segment) => (segment === null ? null : segment[part]));
}

// One number for a whole value: the mean over segments (and over parts, or of one part).
function overall(value, part) {
  if (value === null) return null;
  if (!Array.isArray(value)) return value;
  return mean(value.map((segment) => (Array.isArray(segment) ? (part === undefined ? mean(segment) : segment[part]) : segment)));
}

function shapeOf(value) {
  if (!Array.isArray(value)) return "single";
  return Array.isArray(value[0]) ? "parts" : "segments";
}

function sampleOf(values) {
  return values.find((value) => value !== null && value !== undefined);
}

// The positions of the values used for the start, midway, or end of training:
// the first, middle, or last few that exist.
function momentIndices(values, moment, count = 5) {
  const present = values.map((value, index) => (value === null ? null : index)).filter((index) => index !== null);
  if (!present.length) return [];
  const take = Math.max(1, Math.min(count, Math.ceil(present.length / 5)));
  if (moment === "start") return present.slice(0, take);
  if (moment === "end") return present.slice(-take);
  const from = Math.max(0, Math.floor(present.length / 2 - take / 2));
  return present.slice(from, from + take);
}

function momentMean(values, moment) {
  return meanOfValues(momentIndices(values, moment).map((index) => values[index]));
}

// Whether a value is a mean over the episodes that ended in each window.
function isEpisodeMean(key) {
  return (key.startsWith("episodes.") && key !== "episodes.episode_ended") || key === "report.distance_closed" || key === "report.mean_return";
}

// Log records taken together, with the episodes each holds: one episode
// length of training windows, or every seed of one evaluated actor. Episode
// values are means over its episodes, step values means over its records,
// and the bin counts of histograms are added up.
function recordSample(records, episodeCounts) {
  return {
    episodes: episodeCounts.reduce((a, b) => a + b, 0),
    episodeMean: (key) => weightedMeanOfValues(records.map((record) => shown(record, key)), episodeCounts),
    stepMean: (key) => meanOfValues(records.map((record) => shown(record, key))),
    counts: (key) => {
      const present = records.map((record) => raw(record, key)).filter((counts) => counts !== null);
      return present.length ? present[0].map((_, bin) => present.reduce((sum, counts) => sum + counts[bin], 0)) : null;
    },
  };
}

// One number for a value over a sample: the mean over the segments (or one part).
function sampleValue(sample, key, part) {
  return overall(isEpisodeMean(key) ? sample.episodeMean(key) : sample.stepMean(key), part);
}

function timeLimit(settings) {
  return settings.environment.max_episode_steps * STEP_SECONDS;
}

// Episodes that ran out of time last exactly the time limit, so the mean
// length of those that arrived follows from the mean length and the share.
function arrivalSeconds(sample, settings) {
  const share = sample.episodeMean("episodes.arrived"), length = sample.episodeMean("episodes.length_steps");
  if (share === null || length === null || share <= 0) return null;
  return (length - (1 - share / 100) * timeLimit(settings)) / (share / 100);
}

// The share of episodes whose head ended closer to its target than it started.
function closerShare(sample) {
  const counts = sample.counts("episode_distributions.distance_closed");
  if (!counts) return null;
  const from = info("episode_distributions.distance_closed").edges.findIndex((edge) => edge >= 0);
  const total = counts.reduce((a, b) => a + b, 0);
  return total ? (100 * counts.slice(from).reduce((a, b) => a + b, 0)) / total : null;
}

// =============================================================================
// 4. Formatting.
// =============================================================================

function humanise(name) {
  const words = String(name).replaceAll("_", " ");
  return words.charAt(0).toUpperCase() + words.slice(1);
}

function stripShape(text) {
  return text.replace(/,?\s*\([A-Z0-9, ]*\)/g, "");
}

function number(value) {
  if (value === null || value === undefined || Number.isNaN(value)) return "–";
  const size = Math.abs(value);
  if (size === 0) return "0";
  if (size >= 10000) return Math.round(value).toLocaleString("en");
  if (size >= 100) return value.toFixed(0);
  if (size >= 0.0001) return String(Number(value.toPrecision(3)));
  return value.toExponential(1);
}

function withUnit(value, unit) {
  const text = number(value);
  if (text === "–" || !unit) return text;
  return unit === "%" || unit === "°" ? text + unit : `${text} ${unit}`;
}

function count(value) {
  if (value >= 1e9) return `${Number((value / 1e9).toPrecision(3))} G`;
  if (value >= 1e6) return `${Number((value / 1e6).toPrecision(3))} M`;
  if (value >= 1e4) return `${Number((value / 1e3).toPrecision(3))} k`;
  return Math.round(value).toLocaleString("en");
}

function axisCount(value) {
  if (Math.abs(value) >= 1e6) return `${Number((value / 1e6).toPrecision(3))} M`;
  if (Math.abs(value) >= 1e3) return `${Number((value / 1e3).toPrecision(3))} k`;
  return String(Math.round(value));
}

function duration(seconds) {
  if (seconds < 60) return `${Number(seconds.toPrecision(3))} s`;
  const minutes = Math.round(seconds / 60);
  if (minutes < 60) return `${minutes} min`;
  return `${Math.floor(minutes / 60)} h ${minutes % 60} min`;
}

// =============================================================================
// 5. Building blocks.
// =============================================================================

const SVG_NS = "http://www.w3.org/2000/svg";
const BLUE = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95", "#0d366b"];
const RED = ["#9a2525", "#c13433", "#e34948", "#ec7c7b", "#f4a9a8"];
const SERIES = [1, 2, 3, 4, 5, 6].map((n) => `var(--series-${n})`);
const ACTOR_COLORS = ["var(--series-1)", "var(--baseline-1)", "var(--baseline-2)"];
// Reward terms by name: arrival green, progress blue, the step cost grey, and
// the posture costs warm, the movement cost its own; efficiency is the term
// of the reward used before 8 October 2026, which held the step cost and
// progress together.
const PART_COLORS = { arrival: "var(--series-3)", progress: "var(--series-1)", step_cost: "var(--baseline-1)",
  efficiency: "var(--series-4)", body_contact: "var(--series-2)", leg_contact: "var(--series-5)",
  movement: "var(--series-6)" };
function partColor(name, index) {
  return PART_COLORS[name.toLowerCase().replaceAll(" ", "_")] || SERIES[index % SERIES.length];
}
// Each chart is drawn about as wide as its card, so its text stays readable.
const CHART_WIDTH = { w12: 1100, w8: 730, w7: 640, w6: 550, w5: 450, w4: 360, w3: 270 };
let nextId = 0;

function html(tag, attributes = {}, ...children) {
  const element = document.createElement(tag);
  for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
  element.append(...children.filter((child) => child !== null && child !== undefined && child !== false));
  return element;
}

function svg(tag, attributes = {}, ...children) {
  const element = document.createElementNS(SVG_NS, tag);
  for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
  element.append(...children);
  return element;
}

function hoverText(text) { return svg("title", {}, text); }

function cssColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function mixColors(from, to, fraction) {
  const a = from.match(/\w\w/g).map((x) => parseInt(x, 16));
  const b = to.match(/\w\w/g).map((x) => parseInt(x, 16));
  return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * fraction).toString(16).padStart(2, "0")).join("");
}

function rampColor(ramp, fraction) {
  const position = Math.min(Math.max(fraction, 0), 1) * (ramp.length - 1);
  const index = Math.min(Math.floor(position), ramp.length - 2);
  return mixColors(ramp[index], ramp[index + 1], position - index);
}

function isDark(hex) {
  const [r, g, b] = hex.match(/\w\w/g).map((x) => parseInt(x, 16) / 255);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b < 0.5;
}

// The way a value (or one of its parts) is better: "higher", "lower", or null.
function betterWay(metric, part) {
  return Array.isArray(metric.better) ? metric.better[part] || null : metric.better;
}

// From dark red (0, worst) through grey to dark blue (1, best).
function qualityColor(fraction) {
  return rampColor([...RED, cssColor("--middle"), ...BLUE.slice(1)], fraction);
}

// A value with a better way runs from red (worst) to blue (best) over the
// values shown, through grey at zero when they cross it and at the middle
// otherwise; a fixed range replaces the values shown. Other values: percentages
// run from 0 to 100, values on both sides of zero diverge around it (red below,
// blue above), and anything else runs from its lowest to its highest.
function colorScale(values, unit, range = null, better = null) {
  const finite = values.filter((v) => v !== null && Number.isFinite(v));
  let low = finite.length ? Math.min(...finite) : 0, high = finite.length ? Math.max(...finite) : 1;
  if (better) {
    if (range) [low, high] = range;
    if (low === high) { low -= Math.abs(low) || 1; high += Math.abs(high) || 1; }
    const centre = low < 0 && high > 0 ? 0 : (low + high) / 2;
    const reach = Math.max(centre - low, high - centre);
    const good = (v) => 0.5 + ((better === "higher" ? 1 : -1) * (v - centre)) / reach / 2;
    return { low: centre - reach, high: centre + reach, diverging: centre === 0, better, color: (v) => qualityColor(good(v)) };
  }
  if (unit === "%") { low = 0; high = Math.max(100, high); }
  if (range) [low, high] = range;
  if (low < 0 && high > 0) {
    const limit = Math.max(-low, high);
    const middle = cssColor("--middle");
    const negative = [...RED, middle], positive = [middle, ...BLUE.slice(1)];
    return { low: -limit, high: limit, diverging: true,
      color: (v) => (v < 0 ? rampColor(negative, 1 + v / limit) : rampColor(positive, v / limit)) };
  }
  if (low === high) high = low + (Math.abs(low) || 1);
  return { low, high, diverging: false, color: (v) => rampColor(BLUE, (v - low) / (high - low)) };
}

function niceTicks(low, high, count) {
  if (low === high) { low -= 1; high += 1; }
  const rough = (high - low) / count;
  const power = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * power).find((s) => s >= rough);
  const ticks = [];
  const last = Math.ceil(high / step - 1e-9) * step;
  for (let tick = Math.floor(low / step + 1e-9) * step; tick <= last + step * 1e-9; tick += step) {
    ticks.push(Math.abs(tick) < step * 1e-9 ? 0 : tick);
  }
  return ticks;
}

// A centred moving average over the values that exist: each one is averaged
// with its nearest existing neighbours, however many windows lie between them.
// Missing values stay missing.
function smoothedValues(values) {
  const present = values.map((v, index) => (v !== null && Number.isFinite(v) ? index : null)).filter((index) => index !== null);
  const reach = Math.max(1, Math.round(present.length / 24));
  const smoothed = values.map(() => null);
  present.forEach((index, position) => {
    const neighbours = present.slice(Math.max(0, position - reach), position + reach + 1);
    smoothed[index] = mean(neighbours.map((neighbour) => values[neighbour]));
  });
  return smoothed;
}

// The explanation of a card: its title opens a small window with the text.
function cardTitle(title, about, keys) {
  const id = `about-${nextId++}`;
  const sources = keys.flatMap((key) => (key.startsWith("report.") ? info(key).uses : [key]));
  const popover = html("div", { id, popover: "", class: "about" },
    html("h4", {}, title),
    html("p", {}, about),
    sources.length ? html("p", { class: "source" }, `In the log: ${sources.join(", ")}`) : null);
  const button = html("button", { class: "about-button", popovertarget: id, title: "What is this?" },
    html("span", { class: "title-text" }, title), html("span", { class: "about-mark", "aria-hidden": "true" }, "i"));
  return [html("h3", {}, button), popover];
}

function card(spec, ...content) {
  const metric = spec.key ? info(spec.key) : null;
  const title = spec.title || (metric && (spec.part !== undefined ? `${metric.label}: ${metric.parts[spec.part]}` : metric.label));
  const about = spec.about || (metric && metric.about) || "";
  const keys = spec.keys || (spec.key ? [spec.key] : []);
  const unit = metric && metric.unit ? metric.unit : "";
  const subtitle = spec.subtitle !== undefined ? spec.subtitle : (unit ? `in ${unit === "%" ? "percent" : unit}` : "");
  return html("div", { class: `card ${spec.size === "small" ? "small" : ""} ${spec.width || ""}` },
    ...cardTitle(title, about, keys),
    subtitle ? html("p", { class: "subtitle" }, subtitle) : null,
    ...content);
}

function legend(names, colors, lines = false) {
  return html("div", { class: "legend" }, ...names.map((name, i) =>
    html("span", {}, html("span", { class: `swatch${lines ? " line" : ""}`, style: `background:${colors[i]}` }), name)));
}

function empty(text = "No values yet") { return html("div", { class: "empty" }, text); }

// -- Charts --------------------------------------------------------------------

// Lines over an x axis. Each series is { name, values, color }, its values
// lined up with x; "smooth" draws faint points under a moving average, and
// "pointsOnly" only points. Options: unit, size,
// width, band (a range per x), fillBetween (two series' indices), markers
// (vertical lines at { x, label }), hover (x to text), and range (a fixed
// range for the values). Percentages never go below 0.
function lineChart(x, series, options) {
  const { unit = "", size = "large", band = null, markers = [], fillBetween = null } = options;
  const hover = options.hover || ((c) => `${count(c)} steps`);
  const width = options.width || 420;
  const height = size === "large" ? (width > 800 ? 250 : 210) : 130;
  const left = 46, right = 12, top = 10, bottom = 24;
  const prepared = series.map((s) => {
    const points = x.map((c, i) => [c, s.values[i]]).filter(([, v]) => v !== null && Number.isFinite(v));
    const smooth = s.smooth && points.length > 2;
    const line = smooth ? x.map((c, i) => [c, smoothedValues(s.values)[i]]).filter(([, v]) => v !== null) : points;
    return { ...s, points, line, smooth };
  });
  const all = prepared.flatMap((s) => s.points.map((p) => p[1]))
    .concat(band ? band.flatMap((b) => [b.low, b.high]).filter((v) => v !== null) : []);
  if (!all.length) return empty();
  let low = Math.min(...all), high = Math.max(...all);
  if (options.range) [low, high] = options.range;
  if (unit === "%" && low >= 0) { low = 0; if (high === 0) high = 1; }
  // Angles are marked in steps of 45° so that a 0–180° range ends on a tick.
  const ticks = unit === "°" && options.range ? niceTicks(low / 45, high / 45, 4).map((t) => t * 45) : niceTicks(low, high, 4);
  const yLow = ticks[0], yHigh = ticks[ticks.length - 1];
  const xLow = Math.min(...x), xHigh = Math.max(Math.max(...x), xLow + 1);
  const px = (c) => left + ((c - xLow) / (xHigh - xLow)) * (width - left - right);
  const py = (v) => top + (1 - (v - yLow) / (yHigh - yLow || 1)) * (height - top - bottom);
  const chart = svg("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" });
  for (const tick of ticks) {
    chart.append(svg("line", { x1: left, x2: width - right, y1: py(tick), y2: py(tick), style: "stroke:var(--grid)" }));
    chart.append(svg("text", { x: left - 6, y: py(tick) + 4, "text-anchor": "end" }, withUnit(tick, unit === "%" || unit === "°" ? unit : "")));
  }
  for (const tick of niceTicks(xLow, xHigh, Math.max(2, Math.round(width / 140))).filter((t) => t >= xLow && t <= xHigh)) {
    chart.append(svg("text", { x: px(tick), y: height - 8, "text-anchor": "middle" }, axisCount(tick)));
  }
  chart.append(svg("text", { x: left - 6, y: height - 8, "text-anchor": "end" }, "steps"));
  for (const marker of markers) {
    chart.append(svg("line", { x1: px(marker.x), x2: px(marker.x), y1: top, y2: height - bottom,
      style: "stroke:var(--muted);stroke-dasharray:2 3" }, hoverText(marker.label)));
  }
  const path = (points) => points.map(([c, v], i) => `${i ? "L" : "M"}${px(c).toFixed(1)},${py(v).toFixed(1)}`).join("");
  if (band) {
    const present = x.map((c, i) => [c, band[i]]).filter(([, b]) => b.low !== null);
    const outline = present.map(([c, b]) => [c, b.high]).concat(present.map(([c, b]) => [c, b.low]).reverse());
    if (outline.length) chart.append(svg("path", { d: path(outline) + "Z", style: "fill:var(--series-1);opacity:0.15" }));
  }
  if (fillBetween) {
    const [upper, lower] = fillBetween.map((i) => prepared[i]);
    if (upper && lower && upper.line.length && upper.line.length === lower.line.length) {
      chart.append(svg("path", { d: path(upper.line.concat([...lower.line].reverse())) + "Z", style: "fill:var(--series-2);opacity:0.10" }));
    }
  }
  for (const s of prepared) {
    const radius = size === "large" ? 2.6 : 2;
    if (s.smooth) for (const [c, v] of s.points) chart.append(svg("circle", { cx: px(c), cy: py(v), r: radius, style: `fill:${s.color};opacity:0.3` }));
    if (!s.pointsOnly && s.line.length > 1) {
      chart.append(svg("path", { d: path(s.line), style: `fill:none;stroke:${s.color};stroke-width:2;` +
        "stroke-linejoin:round;stroke-linecap:round" }));
    }
    if (!s.smooth && (s.pointsOnly || s.points.length <= 60 || s.line.length === 1)) {
      for (const [c, v] of s.points) chart.append(svg("circle", { cx: px(c), cy: py(v), r: radius, style: `fill:${s.color}` }));
    }
    for (const [c, v] of s.points) {
      chart.append(svg("circle", { cx: px(c), cy: py(v), r: 8, style: "fill:transparent" },
        hoverText(`${hover(c)}${series.length > 1 ? ` · ${s.name}` : ""}: ${withUnit(v, unit)}`)));
    }
  }
  return chart;
}

// Values that add up, stacked: positive parts above zero and negative parts
// below it, with their sum as a line. Each part is { name, values, color }.
function stackChart(x, parts, options) {
  const { unit = "", size = "large", width = 420, smooth = false, totalName = "total", markers = [] } = options;
  const hover = options.hover || ((c) => `${count(c)} steps`);
  const height = size === "large" ? 210 : 130, left = 46, right = 12, top = 10, bottom = 24;
  const columns = x.map((c, i) => ({ x: c, values: parts.map((p) => (smooth ? smoothedValues(p.values) : p.values)[i]) }))
    .filter((column) => column.values.every((v) => v !== null && Number.isFinite(v)));
  if (!columns.length) return empty();
  for (const column of columns) {
    let above = 0, below = 0;
    column.layers = column.values.map((v) => {
      if (v >= 0) { const layer = [above, above + v]; above += v; return layer; }
      const layer = [below + v, below]; below += v; return layer;
    });
    column.total = column.values.reduce((a, b) => a + b, 0);
    column.above = above; column.below = below;
  }
  const ticks = niceTicks(Math.min(0, ...columns.map((c) => c.below)), Math.max(0, ...columns.map((c) => c.above)), 4);
  const yLow = ticks[0], yHigh = ticks[ticks.length - 1];
  const xLow = Math.min(...x), xHigh = Math.max(Math.max(...x), xLow + 1);
  const px = (c) => left + ((c - xLow) / (xHigh - xLow)) * (width - left - right);
  const py = (v) => top + (1 - (v - yLow) / (yHigh - yLow || 1)) * (height - top - bottom);
  const chart = svg("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" });
  for (const tick of ticks) {
    chart.append(svg("line", { x1: left, x2: width - right, y1: py(tick), y2: py(tick), style: `stroke:var(${tick === 0 ? "--axis" : "--grid"})` }));
    chart.append(svg("text", { x: left - 6, y: py(tick) + 4, "text-anchor": "end" }, withUnit(tick, unit === "%" ? unit : "")));
  }
  for (const tick of niceTicks(xLow, xHigh, Math.max(2, Math.round(width / 140))).filter((t) => t >= xLow && t <= xHigh)) {
    chart.append(svg("text", { x: px(tick), y: height - 8, "text-anchor": "middle" }, axisCount(tick)));
  }
  chart.append(svg("text", { x: left - 6, y: height - 8, "text-anchor": "end" }, "steps"));
  for (const marker of markers) {
    chart.append(svg("line", { x1: px(marker.x), x2: px(marker.x), y1: top, y2: height - bottom,
      style: "stroke:var(--muted);stroke-dasharray:2 3" }, hoverText(marker.label)));
  }
  const toPath = (points) => points.map(([c, v], i) => `${i ? "L" : "M"}${px(c).toFixed(1)},${py(v).toFixed(1)}`).join("");
  // Counts per window are bars: an area would spread one window's count over
  // its neighbours.
  const barWidth = Math.max(1, ((width - left - right) / x.length) * 0.8);
  parts.forEach((part, index) => {
    if (options.bars) {
      for (const column of columns) {
        const [low, high] = column.layers[index];
        if (high > low) chart.append(svg("rect", { x: px(column.x) - barWidth / 2, y: py(high), width: barWidth, height: py(low) - py(high), style: `fill:${part.color}` }));
      }
      return;
    }
    if (columns.length === 1) {
      const [low, high] = columns[0].layers[index];
      chart.append(svg("rect", { x: px(columns[0].x) - 6, y: py(high), width: 12, height: Math.max(0.5, py(low) - py(high)), style: `fill:${part.color}` }));
      return;
    }
    const upper = columns.map((c) => [c.x, c.layers[index][1]]);
    const lower = columns.map((c) => [c.x, c.layers[index][0]]).reverse();
    chart.append(svg("path", { d: toPath(upper.concat(lower)) + "Z", style: `fill:${part.color};opacity:0.75` }));
  });
  if (options.showTotal !== false && parts.length > 1) {
    chart.append(svg("path", { d: toPath(columns.map((c) => [c.x, c.total])), style: "fill:none;stroke:var(--ink);stroke-width:1.5" }));
  }
  for (const column of columns) {
    const lines = parts.map((p, i) => `${p.name}: ${withUnit(column.values[i], unit)}`).join("\n");
    chart.append(svg("rect", { x: px(column.x) - 4, y: top, width: 8, height: height - top - bottom, style: "fill:transparent" },
      hoverText(`${hover(column.x)}\n${totalName}: ${withUnit(column.total, unit)}\n${lines}`)));
  }
  return chart;
}

// Rows of cells over the x axis: one row per segment (head at the top) or per
// bin. Columns are the x values that have any value; long runs are averaged
// into fewer columns. rowLabels names the rows; empty labels are not drawn.
function heatmap(x, rows, options) {
  const { unit = "", size = "large", scale, width = 900 } = options;
  const xFormat = options.xFormat || axisCount;
  const rowName = options.rowName || ((row) => `segment ${row}`);
  let columns = x.map((c, i) => ({ first: c, last: c, values: rows.map((row) => row[i]) }))
    .filter((column) => column.values.some((v) => v !== null));
  if (!columns.length) return empty();
  const limit = size === "large" ? 240 : 120;
  if (columns.length > limit) columns = binColumns(columns, limit);
  const small = size === "small";
  const rowLabels = options.rowLabels || rows.map((_, row) => (row === 0 ? (small ? "head" : "0 head") : (small && row !== rows.length - 1 ? "" : String(row))));
  const left = options.left || (small ? 34 : 52), right = 6, top = 2;
  const rowHeight = options.rowHeight || (small ? 10 : 18), bottom = small ? 16 : 22;
  const rowGap = options.rowGap !== undefined ? options.rowGap : 1;
  const height = top + rows.length * rowHeight + bottom;
  const cellWidth = (width - left - right) / columns.length;
  const chart = svg("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" });
  rowLabels.forEach((label, row) => {
    if (label) chart.append(svg("text", { x: left - 6, y: top + row * rowHeight + rowHeight / 2 + 4, "text-anchor": "end" }, label));
  });
  columns.forEach((column, index) => {
    column.values.forEach((value, row) => {
      if (value === null) return;
      const when = column.first === column.last ? `${xFormat(column.first)} steps` : `${xFormat(column.first)}–${xFormat(column.last)} steps`;
      chart.append(svg("rect", { x: left + index * cellWidth, y: top + row * rowHeight,
        width: cellWidth + 0.4, height: rowHeight - rowGap + (rowGap ? 0 : 0.4), fill: options.cellColor ? options.cellColor(value, row) : scale.color(value) },
        hoverText(`${rowName(row)}, ${when}: ${withUnit(value, unit)}`)));
    });
  });
  const marks = small ? [0, columns.length - 1] : [0, 0.25, 0.5, 0.75, 1].map((f) => Math.round(f * (columns.length - 1)));
  for (const index of new Set(marks)) {
    const anchor = small ? (index === 0 ? "start" : "end") : "middle";
    const position = small ? left + (index === 0 ? 0 : (index + 1) * cellWidth) : left + (index + 0.5) * cellWidth;
    chart.append(svg("text", { x: position, y: height - 5, "text-anchor": anchor }, `${xFormat(columns[index].last)}${index === 0 ? " steps" : ""}`));
  }
  return chart;
}

function binColumns(columns, binCount) {
  const binned = [];
  for (let bin = 0; bin < binCount; bin++) {
    const group = columns.slice(Math.floor((bin * columns.length) / binCount), Math.floor(((bin + 1) * columns.length) / binCount));
    binned.push({ first: group[0].first, last: group[group.length - 1].last,
      values: group[0].values.map((_, row) => mean(group.map((c) => c.values[row]))) });
  }
  return binned;
}

function colorKey(scale, unit, size) {
  const width = size === "small" ? 200 : 280;
  const key = svg("svg", { viewBox: `0 0 ${width} ${scale.better ? 38 : 26}`, style: `max-width:${width}px;margin-top:4px` });
  const steps = 40, inner = width - 40;
  for (let i = 0; i < steps; i++) {
    const value = scale.low + ((i + 0.5) / steps) * (scale.high - scale.low);
    key.append(svg("rect", { x: 20 + (i * inner) / steps, y: 1, width: inner / steps + 0.4, height: 8, fill: scale.color(value) }));
  }
  const marks = scale.diverging ? [scale.low, 0, scale.high] : [scale.low, scale.high];
  for (const mark of marks) {
    key.append(svg("text", { x: 20 + ((mark - scale.low) / (scale.high - scale.low)) * inner, y: 23, "text-anchor": "middle" }, withUnit(mark, unit)));
  }
  if (scale.better) {
    const [left, right] = scale.better === "higher" ? ["worse", "better"] : ["better", "worse"];
    key.append(svg("text", { x: 20, y: 35, "text-anchor": "start", class: "label" }, left));
    key.append(svg("text", { x: width - 20, y: 35, "text-anchor": "end", class: "label" }, right));
  }
  return key;
}

// The values one bin holds; the first and last bins also hold those beyond them.
function binRange(edges, bin, label) {
  const bins = edges.length - 1;
  if (bin === 0) return `below ${label(edges[1])}`;
  if (bin === bins - 1) return `${label(edges[bin])} or more`;
  return `${label(edges[bin])} to ${label(edges[bin + 1])}`;
}

// How a value's bins are labelled: its edges in display units. Episode lengths
// are shown in seconds; shares as percentages.
function binLabeller(key) {
  const source = info(info(key).source);
  return (edge) => withUnit(edge * source.scale, source.unit);
}

// The share of the episodes in each bin, as bars over the bins; each series is
// { name, shares, color }, and bars of several series sit side by side.
// The first and last bins also hold the values beyond them, so the axis labels
// the inner edges. markEdge draws a labelled line at one edge, such as the
// time limit.
function histogramChart(allEdges, allSeries, options) {
  const { width = 360, label = number, markEdge = null } = options;
  const height = 150, left = 34, right = 8, top = 8, bottom = 30;
  // With a limit, such as the time limit, no value lies beyond its bin: the
  // bins after it are left out, and its bar holds the values at the limit.
  const limitBin = markEdge === null ? -1 : allEdges.findIndex((edge) => edge >= markEdge.edge);
  const edges = limitBin >= 0 ? allEdges.slice(0, limitBin + 2) : allEdges;
  const series = allSeries.map((s) => ({ ...s, shares: s.shares.slice(0, edges.length - 1), counts: s.counts && s.counts.slice(0, edges.length - 1) }));
  const bins = edges.length - 1;
  const all = series.flatMap((s) => s.shares).filter((v) => v !== null);
  if (!all.length || all.every((v) => v === 0)) return empty("No episodes ended");
  const ticks = niceTicks(0, Math.max(...all), 3);
  const yHigh = ticks[ticks.length - 1];
  const binWidth = (width - left - right) / bins;
  const barWidth = Math.max(1.5, (binWidth - 2) / series.length);
  const py = (v) => top + (1 - v / (yHigh || 1)) * (height - top - bottom);
  const chart = svg("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" });
  for (const tick of ticks) {
    chart.append(svg("line", { x1: left, x2: width - right, y1: py(tick), y2: py(tick), style: "stroke:var(--grid)" }));
    chart.append(svg("text", { x: left - 5, y: py(tick) + 4, "text-anchor": "end" }, `${number(tick)}%`));
  }
  series.forEach((s, index) => {
    s.shares.forEach((share, bin) => {
      if (!share) return;
      const x = left + bin * binWidth + 1 + index * barWidth;
      const range = binRange(edges, bin, label);
      const of = s.counts ? ` (${count(s.counts[bin])} of ${count(s.total)})` : "";
      chart.append(svg("rect", { x, y: py(share), width: barWidth - 0.5, height: py(0) - py(share), style: `fill:${s.color}` },
        hoverText(`${series.length > 1 ? `${s.name}, ` : ""}${range}: ${number(share)}% of episodes${of}`)));
    });
  });
  // Labels: under the end bars what they hold, as they also hold the values
  // beyond them, and a few edges between them.
  const textAt = (x, text) => chart.append(svg("text", { x, y: height - 16, "text-anchor": "middle" }, text));
  textAt(left + binWidth / 2, `<${label(edges[1])}`);
  if (limitBin < 0) textAt(left + (bins - 0.5) * binWidth, `≥${label(edges[bins - 1])}`);
  for (const index of new Set([0.25, 0.5, 0.75].map((f) => Math.round(f * bins)))) {
    if (index > 1 && index < bins - 1) textAt(left + index * binWidth, label(edges[index]));
  }
  if (markEdge !== null) {
    const index = edges.findIndex((edge) => edge >= markEdge.edge);
    if (index >= 0) {
      const xm = left + index * binWidth;
      chart.append(svg("line", { x1: xm, x2: xm, y1: top, y2: height - bottom, style: "stroke:var(--ink-2);stroke-dasharray:3 3" }));
      chart.append(svg("text", { x: xm, y: height - 3, "text-anchor": "middle", class: "label" }, markEdge.label));
    }
  }
  chart.append(svg("line", { x1: left, x2: width - right, y1: py(0), y2: py(0), style: "stroke:var(--axis)" }));
  return chart;
}

// Bars of shares that add up to 100%, one per column, stacked in the order of
// the classes from the bottom. Each column is { label, cycle, perClass, total }.
function shareBars(columns, classes, width) {
  const height = 230, left = 40, right = 8, top = 8, bottom = 36;
  const chart = svg("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" });
  const py = (share) => top + (1 - share / 100) * (height - top - bottom);
  for (const tick of [0, 25, 50, 75, 100]) {
    chart.append(svg("line", { x1: left, x2: width - right, y1: py(tick), y2: py(tick), style: "stroke:var(--grid)" }));
    chart.append(svg("text", { x: left - 6, y: py(tick) + 4, "text-anchor": "end" }, `${tick}%`));
  }
  const slot = (width - left - right) / columns.length;
  const barWidth = Math.max(1, Math.min(44, slot * 0.78));
  columns.forEach((column, index) => {
    const x = left + index * slot + (slot - barWidth) / 2;
    const lines = classes.map((c, k) => `${c.name}: ${count(column.perClass[k])} (${number((100 * column.perClass[k]) / column.total)}%)`).join("\n");
    const text = `${column.label}, ${count(column.total)} episodes\n${lines}`;
    let below = 0;
    classes.forEach((c, k) => {
      const share = (100 * column.perClass[k]) / column.total;
      if (share > 0) chart.append(svg("rect", { x, y: py(below + share), width: barWidth, height: py(below) - py(below + share), style: `fill:${c.color}` }, hoverText(text)));
      below += share;
    });
  });
  const marks = new Set([0, columns.length - 1, ...[0.25, 0.5, 0.75].map((f) => Math.round(f * (columns.length - 1)))]);
  for (const index of marks) chart.append(svg("text", { x: left + (index + 0.5) * slot, y: height - 20, "text-anchor": "middle" }, String(columns[index].cycle)));
  chart.append(svg("text", { x: left + (width - left - right) / 2, y: height - 4, "text-anchor": "middle" }, "update cycle at the end of each episode length"));
  return chart;
}

// Bars of shares that add up to 100%, one row each, stacked from the left in
// the order of the classes. Each row is { label, perClass, total, minor }:
// minor rows, such as single seeds, are thinner and sit under the row before
// them. Parts wide enough have their share written inside.
function shareRows(rows, classes, width) {
  const left = 108, right = 10, axis = 20;
  let bottom = 0;
  const placed = rows.map((row, index) => {
    bottom += index === 0 ? 0 : row.minor ? 3 : 12;
    const top = bottom, height = row.minor ? 9 : 26;
    bottom += height;
    return { ...row, top, height };
  });
  const height = bottom + axis;
  const px = (share) => left + (share / 100) * (width - left - right);
  const chart = svg("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" });
  for (const tick of [0, 25, 50, 75, 100]) {
    chart.append(svg("line", { x1: px(tick), x2: px(tick), y1: 0, y2: bottom, style: "stroke:var(--grid)" }));
    chart.append(svg("text", { x: px(tick), y: height - 5, "text-anchor": "middle" }, `${tick}%`));
  }
  for (const row of placed) {
    chart.append(svg("text", { x: left - 8, y: row.top + row.height / 2 + 4, "text-anchor": "end", class: row.minor ? "" : "label" }, row.label));
    const lines = classes.map((c, k) => `${c.name}: ${count(row.perClass[k])} (${number((100 * row.perClass[k]) / row.total)}%)`).join("\n");
    const text = `${row.label}, ${count(row.total)} episodes\n${lines}`;
    let from = 0;
    classes.forEach((c, k) => {
      const share = (100 * row.perClass[k]) / row.total;
      if (share <= 0) return;
      const x1 = px(from), x2 = px(from + share);
      chart.append(svg("rect", { x: x1, y: row.top, width: x2 - x1, height: row.height, style: `fill:${c.color}` }, hoverText(text)));
      if (!row.minor && x2 - x1 >= 30) {
        chart.append(svg("text", { x: (x1 + x2) / 2, y: row.top + row.height / 2 + 4, "text-anchor": "middle", "pointer-events": "none",
          style: `fill:${isDark(c.color) ? "#ffffff" : "#0b0b0b"}` }, `${Math.round(share)}%`));
      }
      from += share;
    });
  }
  return chart;
}

// Values that add up, one horizontal bar per row: positive parts to the right
// of zero and negative ones to the left, with their sum as a mark across the
// bar and a number. Each row is { label, values }, one value per part.
function termRows(rows, parts, width, unit) {
  const left = 108, right = 70, rowHeight = 24, gap = 14, axis = 20;
  const placed = rows.map((row, index) => {
    let above = 0, below = 0;
    const layers = row.values.map((value) => {
      if (value >= 0) { above += value; return [above - value, above]; }
      below += value; return [below, below - value];
    });
    return { ...row, layers, above, below, total: row.values.reduce((a, b) => a + b, 0), top: 4 + index * (rowHeight + gap) };
  });
  const ticks = niceTicks(Math.min(0, ...placed.map((row) => row.below)), Math.max(0, ...placed.map((row) => row.above)), 4);
  const low = ticks[0], high = ticks[ticks.length - 1];
  const px = (value) => left + ((value - low) / (high - low || 1)) * (width - left - right);
  const bottom = placed[placed.length - 1].top + rowHeight + 4, height = bottom + axis;
  const chart = svg("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" });
  for (const tick of ticks) {
    chart.append(svg("line", { x1: px(tick), x2: px(tick), y1: 0, y2: bottom, style: `stroke:var(${tick === 0 ? "--axis" : "--grid"})` }));
    chart.append(svg("text", { x: px(tick), y: height - 5, "text-anchor": "middle" }, withUnit(tick, unit === "%" ? unit : "")));
  }
  for (const row of placed) {
    const text = `${row.label}\nsum: ${withUnit(row.total, unit)}\n${parts.map((part, k) => `${part.name}: ${withUnit(row.values[k], unit)}`).join("\n")}`;
    chart.append(svg("text", { x: left - 8, y: row.top + rowHeight / 2 + 4, "text-anchor": "end", class: "label" }, row.label));
    row.layers.forEach(([from, to], k) => {
      if (to > from) chart.append(svg("rect", { x: px(from), y: row.top, width: Math.max(0.5, px(to) - px(from)), height: rowHeight,
        style: `fill:${parts[k].color};opacity:0.85` }, hoverText(text)));
    });
    chart.append(svg("line", { x1: px(row.total), x2: px(row.total), y1: row.top - 3, y2: row.top + rowHeight + 3,
      style: "stroke:var(--ink);stroke-width:2.5" }, hoverText(text)));
    chart.append(svg("text", { x: Math.max(px(row.above), px(row.total)) + 7, y: row.top + rowHeight / 2 + 4, class: "label" }, withUnit(row.total, unit)));
  }
  return chart;
}

// Counts per category as horizontal bars, one row per label and one bar per
// series; the count of the series at index `numbered` is written at the right,
// in its colour.
function horizontalBars(labels, series, width, numbered = series.length - 1) {
  const rowHeight = series.length === 1 ? 22 : 14 + 6 * series.length, left = 104, right = 44, top = 4;
  const height = top + labels.length * rowHeight + 4;
  const high = Math.max(1, ...series.flatMap((s) => s.values));
  const px = (v) => left + (v / high) * (width - left - right);
  const barHeight = (rowHeight - 6) / series.length;
  const chart = svg("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" });
  labels.forEach((label, row) => {
    const y = top + row * rowHeight;
    chart.append(svg("text", { x: left - 8, y: y + rowHeight / 2 + 2, "text-anchor": "end", class: "label" }, label));
    series.forEach((s, k) => {
      const value = s.values[row];
      if (!value) return;
      chart.append(svg("rect", { x: left, y: y + 1 + k * barHeight, width: Math.max(1.5, px(value) - left), height: barHeight - 1, rx: 2, style: `fill:${s.color}` },
        hoverText(`${s.name} · ${label}: ${count(value)} of ${count(s.total)} episodes (${number((100 * value) / s.total)}%)`)));
    });
    chart.append(svg("text", { x: width - 2, y: y + rowHeight / 2 + 2, "text-anchor": "end",
      style: `fill:${series[numbered].color};font-weight:600` }, count(series[numbered].values[row] || 0)));
  });
  chart.append(svg("line", { x1: left, x2: left, y1: top, y2: height - 4, style: "stroke:var(--axis)" }));
  return chart;
}

// A number, with notes on it and the values it is compared with: its value in
// the first episode length of training, or each baseline's in an evaluation,
// which "versus" sets apart below the notes. Each comparison has an arrow
// pointing up where the number is higher, blue when that is better and orange
// when it is worse.
function statTile({ title, about, keys, unit, value, comparisons = [], versus = false, better, notes = [], small = false, width = "" }) {
  const [heading, popover] = cardTitle(title, about, keys);
  const lines = comparisons.map((other) => {
    let arrow = null;
    if (better && value !== null && other.value !== null && Math.abs(value - other.value) > 1e-9 * Math.max(1, Math.abs(other.value))) {
      const improved = (value > other.value) === (better === "higher");
      arrow = html("span", { class: `change ${improved ? "better" : "worse"}` }, value > other.value ? "▲ " : "▼ ");
    }
    return html("div", { class: "from" }, arrow, `${other.name}: ${withUnit(other.value, unit)}`);
  });
  const noteLines = notes.filter(Boolean).map((note) => html("div", { class: "from" }, note));
  // Percent and degree signs stay with the number; other units are smaller.
  const inline = !unit || unit === "%" || unit === "°" || value === null;
  return html("div", { class: `card tile${small ? " small" : ""} ${width}`.trim() },
    html("div", { class: "label" }, heading.firstChild), popover,
    html("div", { class: "value" }, inline ? withUnit(value, unit) : number(value), inline ? null : html("span", { class: "unit" }, unit)),
    ...(versus ? noteLines : lines),
    ...(versus ? (lines.length ? [html("div", { class: "versus" }, ...lines)] : []) : noteLines));
}

// The ending classes, each with the histogram bins it holds and its colour.
function endingClasses(settings, edges) {
  const classes = ENDING_CLASSES.map((c, index) => ({ ...c, bins: [], color: qualityColor(c.quality),
    name: index === 0 && settings.environment.target.arrival_radius_m !== 0.001 ? "within 1 mm" : c.name }));
  for (let bin = 0; bin < edges.length - 1; bin++) {
    const upper = bin === edges.length - 2 ? Infinity : edges[bin + 1];
    classes.find((c) => c.upTo >= upper - 1e-9).bins.push(bin);
  }
  return classes.filter((c) => c.bins.length);
}

// How episodes ended in runs that log the "ending" histogram (from 8 October
// 2026's arrival under the head on): one bin per class, against each episode's
// start distance.
const RELATIVE_ENDING_CLASSES = [
  { name: "arrived", quality: 1 },
  { name: "within a quarter of the start distance", quality: 0.8 },
  { name: "within half", quality: 0.64 },
  { name: "closer", quality: 0.5 },
  { name: "not closer", quality: 0.2 },
  { name: "left the circle", quality: 0.06 },
];

// Which histogram tells where episodes ended, and its classes: the "ending"
// histogram where `logged(key)` finds it, else the final distance of older runs.
function endingSource(settings, logged) {
  const relative = "episode_distributions.ending";
  if (logged(relative)) {
    return { key: relative, classes: RELATIVE_ENDING_CLASSES.map((c, bin) => ({ ...c, bins: [bin], color: qualityColor(c.quality) })) };
  }
  const key = "episode_distributions.final_distance";
  return { key, classes: endingClasses(settings, info(key).edges) };
}

// The ending classes of each sample: rows for shareRows or columns for shareBars.
function endingCounts(sample, classes, key = "episode_distributions.final_distance") {
  const counts = sample.counts(key);
  if (!counts) return null;
  const perClass = classes.map((c) => c.bins.reduce((sum, bin) => sum + counts[bin], 0));
  return { perClass, total: perClass.reduce((a, b) => a + b, 0) };
}

// How long the episodes that arrived took, for each group { name, color,
// sample }: counts per length bin, the fastest at the top, from the fastest
// arrival to the slowest. The count of the group at index `numbered` is written.
function arrivalTimesCard(spec, groups, settings, numbered, missing) {
  const key = "episode_distributions.length_steps";
  const titled = { ...spec, title: "How long arrivals took", keys: [key] };
  const edges = info(key).edges, limit = settings.environment.max_episode_steps;
  const arrivalBins = edges.findIndex((edge) => edge >= limit);
  const counted = groups.map((group) => ({ ...group, values: group.sample.counts(key) }));
  if (counted.every((group) => group.values === null) || arrivalBins < 1) return card(titled, empty(missing));
  const seconds = (edge) => number(edge * STEP_SECONDS);
  const labels = Array.from({ length: arrivalBins }, (_, bin) => `${seconds(edges[bin])}–${seconds(Math.min(edges[bin + 1], limit))} s`);
  const series = counted.map((group) => {
    const values = (group.values || []).slice(0, arrivalBins);
    return { ...group, values, total: values.reduce((a, b) => a + b, 0) };
  });
  if (series.every((s) => !s.total)) return card(titled, empty("No episode arrived"));
  const held = labels.map((_, bin) => series.some((s) => s.values[bin] > 0));
  const from = held.indexOf(true), to = held.lastIndexOf(true) + 1;
  return card(titled, legend(series.map((s) => `${s.name}: ${count(s.total)} arrivals`), series.map((s) => s.color)),
    horizontalBars(labels.slice(from, to), series.map((s) => ({ ...s, values: s.values.slice(from, to) })), CHART_WIDTH[spec.width], numbered));
}

// The body table, with a switch between views, such as the first and the last
// episode length or the actors: each view is { name, sample }. All views share
// each column's colours, so that switching shows the change.
function bodyTableCard(spec, views, initial) {
  const valuesOf = (view) => (key) => view.sample.stepMean(key);
  const sharedScale = (column) => views.flatMap((view) => perSegment(valuesOf(view)(column.key), column.part) || []);
  const holder = html("div", {});
  const buttons = views.map((view) => html("button", { class: "toggle", type: "button" }, view.name));
  const show = (which) => {
    holder.replaceChildren(profileTable(PROFILE_COLUMNS, valuesOf(views[which]), sharedScale));
    buttons.forEach((button, i) => button.classList.toggle("on", i === which));
  };
  buttons.forEach((button, i) => button.addEventListener("click", () => show(i)));
  show(initial);
  return card({ ...spec, title: "The body, segment by segment", about: PROFILE_ABOUT, keys: PROFILE_COLUMNS.map((column) => column.key) },
    views.length > 1 ? html("div", { class: "toggles" }, ...buttons) : null, holder);
}

// Grouped bars: one group per label, one bar per actor.
function groupedBars(labels, series, unit, width = 600) {
  const height = 200, left = 46, right = 6, top = 8, bottom = 28;
  const all = series.flatMap((s) => s.values).filter((v) => v !== null);
  if (!all.length) return empty("No values");
  const ticks = niceTicks(Math.min(0, ...all), Math.max(0, ...all), 4);
  const low = ticks[0], high = ticks[ticks.length - 1];
  const py = (v) => top + (1 - (v - low) / (high - low || 1)) * (height - top - bottom);
  const groupWidth = (width - left - right) / labels.length;
  const barWidth = Math.max(3, (groupWidth - 10) / series.length - 2);
  const chart = svg("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" });
  for (const tick of ticks) {
    chart.append(svg("line", { x1: left, x2: width - right, y1: py(tick), y2: py(tick), style: "stroke:var(--grid)" }));
    chart.append(svg("text", { x: left - 6, y: py(tick) + 4, "text-anchor": "end" }, withUnit(tick, unit === "%" ? unit : "")));
  }
  labels.forEach((label, group) => {
    const groupLeft = left + group * groupWidth + 5;
    series.forEach((s, index) => {
      const value = s.values[group];
      if (value === null) return;
      const barTop = Math.min(py(value), py(0)), barHeight = Math.max(Math.abs(py(value) - py(0)), 1);
      chart.append(svg("rect", { x: groupLeft + index * (barWidth + 2), y: barTop, width: barWidth, height: barHeight, rx: 2,
        style: `fill:${s.color}` }, hoverText(`${s.name}, ${label}: ${withUnit(value, unit)}`)));
    });
    chart.append(svg("text", { x: groupLeft + (groupWidth - 10) / 2, y: height - 10, "text-anchor": "middle" }, label));
  });
  chart.append(svg("line", { x1: left, x2: width - right, y1: py(0), y2: py(0), style: "stroke:var(--axis)" }));
  return chart;
}

// One row per segment, one coloured column per value. Each column has its own
// colour scale, built from scaleValues(column) when tables are to be compared.
function profileTable(columns, valuesFor, scaleValues = null) {
  const columnValues = columns.map((column) => perSegment(valuesFor(column.key), column.part));
  const segmentCount = Math.max(0, ...columnValues.map((v) => (v ? v.length : 0)));
  if (!segmentCount) return empty();
  const scales = columns.map((column, i) =>
    colorScale(scaleValues ? scaleValues(column) : columnValues[i] || [], info(column.key).unit, info(column.key).range,
      betterWay(info(column.key), column.part)));
  const head = html("tr", {}, html("th", {}, ""), ...columns.map((column) => {
    const unit = info(column.key).unit;
    return html("th", {}, column.short, html("span", { class: "unit" }, unit || (column.key.endsWith("uprightness") ? "−1 to 1" : " ")));
  }));
  const rows = [];
  for (let segment = 0; segment < segmentCount; segment++) {
    rows.push(html("tr", {}, html("td", { class: "segment" }, segment === 0 ? "0 head" : String(segment)),
      ...columns.map((column, i) => {
        const value = columnValues[i] ? columnValues[i][segment] : null;
        if (value === null || value === undefined) return html("td", {}, "–");
        const background = scales[i].color(value);
        return html("td", { style: `background:${background};color:${isDark(background) ? "#ffffff" : "#0b0b0b"}`,
          title: `${column.short}, segment ${segment}: ${withUnit(value, info(column.key).unit)}` },
          number(value));
      })));
  }
  return html("div", { class: "scroll" }, html("table", { class: "profile" }, html("thead", {}, head), html("tbody", {}, ...rows)));
}

function table(headings, rows, numericFrom = 1, classes = []) {
  const head = headings.length ? html("thead", {}, html("tr", {}, ...headings.map((text, i) =>
    html("th", i >= numericFrom ? { class: "number" } : {}, text)))) : null;
  const body = html("tbody", {}, ...rows.map((cells, r) => html("tr", {}, ...cells.map((cell, i) =>
    html("td", { class: [i >= numericFrom ? "number" : "", (classes[r] || [])[i] || ""].join(" ").trim() }, cell)))));
  return html("div", { class: "card scroll" }, html("table", {}, head, body));
}

function factsTable(facts) {
  const rows = Object.entries(facts).map(([key, value]) => {
    let text = value;
    if (Array.isArray(value)) text = value.join(", ");
    else if (value && typeof value === "object") text = Object.entries(value).map(([k, v]) => `${k} = ${JSON.stringify(v)}`).join("; ") || "nothing";
    return [humanise(key), String(text)];
  });
  return table([], rows, 99);
}

// Every setting; those the file set itself are marked.
function settingsTable(settings, setKeys) {
  const rows = [], classes = [];
  (function walk(values, prefix) {
    for (const [key, value] of Object.entries(values)) {
      if (value && typeof value === "object" && !Array.isArray(value)) walk(value, `${prefix}${key}.`);
      else {
        const isSet = setKeys.has(`${prefix}${key}`);
        rows.push([`${prefix}${key}`, Array.isArray(value) ? `[${value.join(", ")}]` : String(value), isSet ? "set" : "default"]);
        classes.push(isSet ? ["set", "set", "set"] : []);
      }
    }
  })(settings, "");
  return table(["Setting", "Value", "From"], rows, 99, classes);
}

// The settings summarised as chips; setKeys holds the dotted keys to highlight.
function settingChips(settings, setKeys, note) {
  const chips = [];
  for (const chip of SETTING_CHIPS) {
    let text;
    try { text = chip.text(settings); } catch (error) { continue; }  // a setting this run does not have
    if (!text) continue;  // a setting left at a value that needs no chip
    const isSet = [...setKeys].some((key) => chip.keys.some((prefix) => key === prefix || key.startsWith(`${prefix}.`)));
    chips.push(html("span", { class: `chip${isSet ? " set" : ""}` }, text));
  }
  return [html("div", { class: "chips" }, ...chips), setKeys.size ? html("p", { class: "chips-note" }, note) : html("p", { class: "chips-note" }, "")];
}

function section(number, spec, ...content) {
  return html("section", spec.minor ? { class: "minor" } : {},
    html("h2", {}, html("span", { class: "number" }, String(number)), spec.title),
    spec.intro ? html("p", { class: "note" }, spec.intro) : null,
    ...content);
}

function detailsBlock(...content) {
  return html("details", { class: "more" },
    html("summary", {}, html("span", { class: "when-closed" }, "Show details ▾"), html("span", { class: "when-open" }, "Hide details ▴")),
    ...content);
}

// =============================================================================
// 6. The training report.
// =============================================================================

function trainingReport(root) {
  const log = data.log;
  const settings = data.settings;
  const sessions = data.sessions || [];
  const x = log.map((record) => record.transitions);
  const stepsPerCycle = log.length ? log[0].transitions / log[0].cycle : 1;
  const cycleAt = (transitions) => Math.round(transitions / stepsPerCycle);
  const used = new Set();
  // One episode length in windows, and the windows over which each window's
  // episode values are taken: the last span of windows, all in the same
  // training session, since a resumed session starts new episodes.
  const windowSteps = settings.interaction_loop.rollout_window_steps;
  const span = Math.max(1, Math.ceil(settings.environment.max_episode_steps / windowSteps));
  const episodeCounts = log.map((record) => raw(record, "episodes.episode_ended") || 0);
  const sessionStarts = sessions.map((session) => session.first_cycle);
  const spanStart = (index) => {
    const sessionStart = Math.max(0, ...sessionStarts.filter((first) => first < log[index].cycle));
    const first = index - span + 1;
    return first >= 0 && log[first].cycle > sessionStart ? first : null;
  };
  const overSpan = (values) => values.map((_, index) => {
    const first = spanStart(index);
    return first === null ? null : weightedMeanOfValues(values.slice(first, index + 1), episodeCounts.slice(first, index + 1));
  });
  const series = (key) => {
    used.add(key);
    info(key).uses.forEach((source) => used.add(source));
    const values = log.map((record) => shown(record, key));
    return isEpisodeMean(key) ? overSpan(values) : values;
  };
  const simulation = settings.environment.simulation;
  const worldSteps = simulation.world_count * windowSteps;
  // Episode values are already means over an episode length of windows.
  const smoothFor = (key) => {
    const category = key.startsWith("report.") ? (key === "report.reward_per_step" ? "step_facts" : "episodes") : key.split(".")[0];
    return category === "step_facts" && worldSteps < SMOOTH_BELOW.step_facts;
  };
  // Blocks of whole episode lengths: the windows of cycles k·span + 1 to
  // (k + 1)·span, all in one training session. All worlds start together, so
  // in each block every world ends at least one episode; the first and the
  // last block are what "first" and "last" mean.
  const indexOfCycle = new Map(log.map((record, index) => [record.cycle, index]));
  const blocks = [];
  const lastCycle = log.length ? log[log.length - 1].cycle : 0;
  for (let start = 1; start + span - 1 <= lastCycle; start += span) {
    const indices = Array.from({ length: span }, (_, i) => indexOfCycle.get(start + i));
    const resumedInside = sessionStarts.some((first) => first >= start && first <= start + span - 2);
    if (indices.every((index) => index !== undefined) && !resumedInside) blocks.push(indices);
  }
  const firstSpan = blocks[0] || [], lastSpan = blocks[blocks.length - 1] || [];
  const blockLabel = (indices) => `cycles ${log[indices[0]].cycle}–${log[indices[indices.length - 1]].cycle}`;
  // A block's windows, each counted by the episodes that ended in it.
  const blockSample = (indices) => recordSample(indices.map((i) => log[i]), indices.map((i) => episodeCounts[i]));
  // The first and the last block, to compare; only the last while they are one.
  const moments = !lastSpan.length ? [] : firstSpan === lastSpan ? [["Last", lastSpan, "var(--series-1)"]]
    : [["First", firstSpan, "var(--baseline-1)"], ["Last", lastSpan, "var(--series-1)"]];
  // Where a later training session resumed the run.
  const markers = sessions.slice(1).map((session, index) => ({ x: session.first_cycle * stepsPerCycle,
    label: `Session ${index + 2} started at cycle ${session.first_cycle} (${session.started})` }));
  const context = { x, log, series, smoothFor, markers, cycleAt, settings, sessions, span, firstSpan, lastSpan, blocks,
    blockLabel, blockSample, moments, used, episodeCounts,
    hover: (c) => `cycle ${cycleAt(c)} · ${count(c)} steps` };

  // Header: what the run is, how far it got, and its settings.
  const last = log[log.length - 1];
  const trainingSeconds = log.reduce((sum, r) => sum + (r.timing.collecting_seconds || 0) + (r.timing.learning_seconds || 0), 0);
  const episodes = log.reduce((sum, r) => sum + (raw(r, "episodes.episode_ended") || 0), 0);
  root.append(html("h1", {}, data.title), html("p", { class: "status" }, last
    ? `Training run · cycle ${last.cycle} of ${settings.interaction_loop.update_cycles} · ${count(last.transitions)} steps · ` +
      `${count(episodes)} episodes · ${duration(trainingSeconds)} of training` +
      (sessions.length > 1 ? ` in ${sessions.length} sessions` : "")
    : "Training run · nothing logged yet"));
  const written = new Set(sessions.flatMap((session) => session.settings_written || []));
  root.append(...settingChips(settings, written, "Highlighted: set in the run's configuration files; the others are defaults."));
  if (!log.length) return;
  if (!blocks.length) {
    root.append(html("p", { class: "warning" }, `The episode values need one full episode length of windows (${span}); this run has ${log.length}. ` +
      "Episodes end at the target or at the time limit, so until then only the early arrivals have ended. The values measured at every step are shown already."));
  }
  series("learning.learning_rate");  // charted only when it changes; the chips give it otherwise

  // Results, learning, behaviour, and the run, as the layout says.
  TRAINING_LAYOUT.forEach((layout, index) => {
    const spec = layout.tiles ? { ...layout, intro: RESULTS_INTRO(span, span * windowSteps) } : layout;
    const content = spec.tiles ? [trainingTiles(context)] : [];
    for (const row of spec.rows) {
      const items = row.filter((item) => !item.onlyIf || item.onlyIf(settings));
      const autoWidth = `w${Math.floor(12 / items.length)}`;
      content.push(html("div", { class: "row" }, ...items.map((item) => trainingCard(item.width === "auto" ? { ...item, width: autoWidth } : item, context))));
    }
    root.append(section(index + 1, spec, ...content));
  });

  // Details: physics, per-segment heatmaps, everything else, tables, settings.
  const details = [];
  for (const group of TRAINING_DETAILS) {
    details.push(html("h3", { class: "group" }, group.title), group.intro ? html("p", { class: "note" }, group.intro) : null);
    details.push(html("div", { class: "row" }, ...group.cards.map((item) => trainingCard(item, context))));
  }
  const remaining = Object.keys(DESCRIPTIONS).filter((key) => !used.has(key));
  if (remaining.length) {
    details.push(html("h3", { class: "group" }, "Other values"), html("p", { class: "note" }, "Everything else the run logged."));
    details.push(html("div", { class: "row" }, ...remaining.map((key) => genericCard(key, context))));
  }
  details.push(html("h3", { class: "group" }, "Every value at the start and at the end"),
    html("p", { class: "note" }, "Means of the first and last few windows; episode values over the first and the last full episode length of windows. Per-segment values are averaged over the segments."),
    valuesTable(log, series));
  if (sessions.length) {
