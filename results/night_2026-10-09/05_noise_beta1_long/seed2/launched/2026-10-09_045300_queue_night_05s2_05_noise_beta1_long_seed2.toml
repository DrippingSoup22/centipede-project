# Night tests, 2026-10-09 (results/night_2026-10-09/): the assistant runs
# short tests one at a time while the user sleeps, each on the reward-study
# baseline with 256 worlds (test 01) and one change, judged by the evaluation
# with the policy's mean action.
#
# Second seed (seed 2) of the test below.
#
# Test 05: test 03 (pink exploration noise, beta 1) for 96 cycles instead of
# 32, about 50 minutes on the 3080. With pink noise the training arrivals fell
# from about 20% to 0%: the white noise's jitter had been moving the body like
# a vibrating brush, while the mean action only held a posture. Question: given
# three times longer, does the policy learn to walk with its mean, so that the
# arrivals come back with smoother legs?

[run]
mode = "train"
name = "night_05_noise_beta1_long_seed2"
seed = 2
checkpoint_every_cycles = 16
start_from = "runs/2026-10-07_2221_baseline_stage2"

[environment]
max_episode_steps = 256
spine_control = true

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 256

[environment.target]
distance_range_m = [0.030, 0.060]
bearing_range_deg = [-30, 30]
arrival = "head"
range_circle_ratio = 2.5

[environment.rewards]
arrival_reward = 1
step_cost_parts = 2
body_contact_cost_parts = 3
leg_contact_cost_parts = 1
movement_cost_parts = 0
head_progress_ratio = 1
follower_progress_share = 1

[agents]
device = "cuda"
exploration_noise_beta = 1.0

[agents.ppo]
minibatch_size = 2048

[interaction_loop]
rollout_window_steps = 64
update_cycles = 96
