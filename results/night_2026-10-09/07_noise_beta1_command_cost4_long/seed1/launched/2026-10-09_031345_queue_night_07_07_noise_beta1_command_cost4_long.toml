# Night tests, 2026-10-09 (results/night_2026-10-09/): the assistant runs
# short tests one at a time while the user sleeps, each on the reward-study
# baseline with 256 worlds (test 01) and one change, judged by the evaluation
# with the policy's mean action.
#
# Test 07: test 05 (pink noise, beta 1, 96 cycles) with the command cost of
# test 04 (Gymnasium Ant's, ratio 4). In test 05 the mean action reached the
# target in 44% of the evaluation's episodes, the first time any did, but by
# buzzing: each leg flipped back and forth almost every 20 ms step (93% of its
# movement's power above 5 Hz, more than random commands). With pink noise
# the exploration can no longer buzz, so the policy buzzes with its own mean
# action, which a cost can reach. Question: does the Ant's control cost turn
# the buzz into strokes while the arrivals stay?

[run]
mode = "train"
name = "night_07_noise_beta1_command_cost4_long"
seed = 1
checkpoint_every_cycles = 16
start_from = "runs/2026-10-07_2221_baseline_stage2"

[environment]
max_episode_steps = 256
spine_control = true

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 256

[environment.target]
distance_range_m = [0.030, 0.060]
bearing_range_deg = [-30, 30]
arrival = "head"
range_circle_ratio = 2.5

[environment.rewards]
arrival_reward = 1
step_cost_parts = 2
body_contact_cost_parts = 3
leg_contact_cost_parts = 1
movement_cost_parts = 0
command_cost_ratio = 4
head_progress_ratio = 1
follower_progress_share = 1

[agents]
device = "cuda"
exploration_noise_beta = 1.0

[agents.ppo]
minibatch_size = 2048

[interaction_loop]
rollout_window_steps = 64
update_cycles = 96
