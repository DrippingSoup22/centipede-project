# Pink-noise study, 2026-10-09 (results/pink_study/): night test 05 (pink
# exploration noise, beta 1, 256 worlds, 96 cycles from the standing
# prototype), the first run whose mean action reached targets, with one
# change per file. Each run is judged by the evaluation with the policy's mean
# action on 128 episodes (evaluation.toml), against test 05's two seeds
# evaluated the same way (configs/night/evaluations/). One seed per change
# for screening; a second seed for what looks better. Two files at a time on
# Kaggle, one per T4, or one at a time on the 3080:
#
#   python scripts/kaggle_gpu.py run configs/pink_study/01_gae_lambda09.toml configs/pink_study/04_hidden256.toml
#   python scripts/gpu_desktop.py run configs/pink_study/02_progress_ratio2.toml
#
# Test 01: GAE lambda 0.9 instead of 0.95, the value Andrychowicz et al.
# (ICLR 2021) recommend for PPO. In test 05's last quarter the head's critic
# explained 88% of the returns' variance, but the followers' only 4-18%:
# only the head sees the target. With a critic that predicts little, a
# segment's advantage is close to the sum of the shared rewards over the next
# 1 / (1 - gamma lambda) steps: about 19 steps at 0.95, 10 at 0.9, so half as
# much of the other segments' noise. Question: does the mean action arrive
# more often, or aim better? About 50 minutes on the 3080, 70 on a Kaggle T4.

[run]
runs_folder = "/kaggle/working"  # set by kaggle_gpu.py
mode = "train"
name = "pink_01_gae_lambda09"
seed = 1
checkpoint_every_cycles = 16
start_from = "runs/2026-10-07_2221_baseline_stage2"

[environment]
max_episode_steps = 256
spine_control = true

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 256

[environment.target]
distance_range_m = [0.030, 0.060]
bearing_range_deg = [-30, 30]
arrival = "head"
range_circle_ratio = 2.5

[environment.rewards]
arrival_reward = 1
step_cost_parts = 2
body_contact_cost_parts = 3
leg_contact_cost_parts = 1
movement_cost_parts = 0
head_progress_ratio = 1
follower_progress_share = 1

[agents]
device = "cuda"
exploration_noise_beta = 1.0

[agents.ppo]
minibatch_size = 2048
gae_lambda = 0.9

[interaction_loop]
rollout_window_steps = 64
update_cycles = 96
