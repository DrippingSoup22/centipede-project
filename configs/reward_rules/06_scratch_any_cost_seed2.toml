# Reward rules, 2026-10-08 (plan.md, Stage 8.4): the first runs with the reward
# rebuilt from its rules (docs/environment.md, Rewards). Everything else is as
# in the short-episode runs, so the reward is the one change:
# - reward: arrival 1, costs split 3 : 2 : 1 (body : step : legs) of the
#   budget that makes the worst arrival balance to zero, progress counted in
#   halvings of the distance, one halving worth one episode of step cost, the
#   followers' progress a tenth of the head's;
# - discount 2^(-1/256) = 0.9973, which the configuration sets from the
#   episode length (rule R0), so it is not written here;
# - 64 worlds, episode length 256 steps, rollout window 64 steps (4 windows
#   per episode), minibatch size 512, epochs 4; targets 10-20 mm, within 15
#   degrees, as before.
#
# Path B, first stage, with a second seed: the same as 05_scratch_any_cost.

[run]
mode = "train"
name = "rules_06_scratch_any_cost_seed2"
seed = 2
checkpoint_every_cycles = 16

[environment]
max_episode_steps = 256

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 64

[environment.target]                  # pinned: these runs' task, the head's tip
distance_range_m = [0.010, 0.020]     # within 1 mm of targets 10-20 mm away
bearing_range_deg = [-15, 15]
arrival_radius_m = 0.001

[environment.rewards]
arrival_reward = 1
step_cost_parts = 2
body_contact_cost_parts = 0     # off: reaching at any cost
leg_contact_cost_parts = 0      # off
cost_budget_parts = 6           # as in the whole reward, so the step cost stays
head_progress_ratio = 1
follower_progress_ratio = 0.1

[agents]
device = "cuda"

[agents.ppo]
minibatch_size = 512

[interaction_loop]
rollout_window_steps = 64
update_cycles = 128
