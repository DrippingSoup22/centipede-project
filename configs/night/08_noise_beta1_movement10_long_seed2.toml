# Night tests, 2026-10-09 (results/night_2026-10-09/): the assistant runs
# short tests one at a time while the user sleeps, each on the reward-study
# baseline with 256 worlds (test 01) and one change, judged by the evaluation
# with the policy's mean action.
#
# Second seed (seed 2) of the test below.
#
# Test 08: test 05 (pink noise, beta 1, 96 cycles) with the movement cost
# (rule R5) aimed at the buzz: 2 parts of the cost budget, and a unit of 10
# degrees per step instead of 25, so that test 05's buzz (10.7 degrees per
# step) counts as 1, the most, while a smooth stroke of 20 degrees at 2 Hz
# (about 2.5 degrees per step) counts 0.06. Unlike the command cost, it charges
# how fast the joints move, not how large the commands are. The budget's 8
# parts make the step cost and the progress per halving three quarters of
# what they were. Question: does charging fast joint movement turn the buzz
# into strokes while the arrivals stay?

[run]
mode = "train"
name = "night_08_noise_beta1_movement10_long_seed2"
seed = 2
checkpoint_every_cycles = 16
start_from = "runs/2026-10-07_2221_baseline_stage2"

[environment]
max_episode_steps = 256
spine_control = true

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 256

[environment.target]
distance_range_m = [0.030, 0.060]
bearing_range_deg = [-30, 30]
arrival = "head"
range_circle_ratio = 2.5

[environment.rewards]
arrival_reward = 1
step_cost_parts = 2
body_contact_cost_parts = 3
leg_contact_cost_parts = 1
movement_cost_parts = 2
random_command_movement_deg = 10
head_progress_ratio = 1
follower_progress_share = 1

[agents]
device = "cuda"
exploration_noise_beta = 1.0

[agents.ppo]
minibatch_size = 2048

[interaction_loop]
rollout_window_steps = 64
update_cycles = 96
