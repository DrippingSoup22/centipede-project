# Night tests, 2026-10-09 (results/night_2026-10-09/): the assistant runs
# short tests one at a time while the user sleeps, each on the reward-study
# baseline with 256 worlds (test 01) and one change, judged by the evaluation
# with the policy's mean action.
#
# Test 02: colored exploration noise, beta 0.5 (the PPO default of
# Hollenstein, Martius and Piater, AAAI 2024): successive steps' noise
# correlates 0.36, and the noise changes from step to step 81% as much as
# white noise. Question: does smoother exploration help the mean action walk?

[run]
mode = "train"
name = "night_02_noise_beta05"
seed = 1
checkpoint_every_cycles = 16
start_from = "runs/2026-10-07_2221_baseline_stage2"

[environment]
max_episode_steps = 256
spine_control = true

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 256

[environment.target]
distance_range_m = [0.030, 0.060]
bearing_range_deg = [-30, 30]
arrival = "head"
range_circle_ratio = 2.5

[environment.rewards]
arrival_reward = 1
step_cost_parts = 2
body_contact_cost_parts = 3
leg_contact_cost_parts = 1
movement_cost_parts = 0
head_progress_ratio = 1
follower_progress_share = 1

[agents]
device = "cuda"
exploration_noise_beta = 0.5

[agents.ppo]
minibatch_size = 2048

[interaction_loop]
rollout_window_steps = 64
update_cycles = 32
