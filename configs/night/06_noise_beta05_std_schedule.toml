# Night tests, 2026-10-09 (results/night_2026-10-09/): the assistant runs
# short tests one at a time while the user sleeps, each on the reward-study
# baseline with 256 worlds (test 01) and one change, judged by the evaluation
# with the policy's mean action.
#
# Test 06: test 02 (colored noise, beta 0.5) for 96 cycles, with the action
# spreads on a schedule instead of learned: from 0.44 (the standing
# prototype's, about) to 0.2 in a straight line of their logarithms, as the
# PPO paper annealed its humanoid tasks' log spread (-0.7 to -1.6, that is 0.50
# to 0.20; Schulman et al., 2017). Left to learning, the spreads barely move
# (0.45 to 0.43 in 32 cycles), and the noise keeps doing the walking. Question:
# as the noise fades, does the mean action take over and reach the targets?

[run]
mode = "train"
name = "night_06_noise_beta05_std_schedule"
seed = 1
checkpoint_every_cycles = 16
start_from = "runs/2026-10-07_2221_baseline_stage2"

[environment]
max_episode_steps = 256
spine_control = true

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 256

[environment.target]
distance_range_m = [0.030, 0.060]
bearing_range_deg = [-30, 30]
arrival = "head"
range_circle_ratio = 2.5

[environment.rewards]
arrival_reward = 1
step_cost_parts = 2
body_contact_cost_parts = 3
leg_contact_cost_parts = 1
movement_cost_parts = 0
head_progress_ratio = 1
follower_progress_share = 1

[agents]
device = "cuda"
exploration_noise_beta = 0.5
initial_action_std = 0.44
action_std_schedule = "log_linear"
final_action_std = 0.2

[agents.ppo]
minibatch_size = 2048

[interaction_loop]
rollout_window_steps = 64
update_cycles = 96
