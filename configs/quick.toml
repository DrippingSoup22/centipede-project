# Quick level, about 3 minutes on an RTX 3080: checks that a GPU run works
# from start to finish and measures its speed, with a report. Three short
# windows give three updates; nothing is expected to be learned. An RTX 3080
# takes about 0.82 s per step at 1,024 worlds, so 53 s per cycle (2.2
# minutes on a T4).
#
#   python -m centipede configs/quick.toml

[run]
mode = "train"
name = "quick"
seed = 1
checkpoint_every_cycles = 3
# No replay recordings: one whole episode (8,192 steps) of 1,024 worlds would
# need about 2.2 GiB of GPU memory while it is recorded.
record_every_episodes = 0

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 1024

[agents]
device = "cuda"

[agents.ppo]
# Eight minibatches per epoch: 1,024 worlds x 64 steps = 65,536 samples.
minibatch_size = 8192

[interaction_loop]
rollout_window_steps = 64
update_cycles = 3
