# Quick level, about 3 minutes on the RTX 3080: checks that a GPU run works
# from start to finish and measures its speed, with a report. Three short
# windows give three updates; nothing is expected to be learned. Projected
# from the measured step time (plan.md, Stage 8.4): 0.82 s per step at 1,024
# worlds, so 53 s per cycle (2.2 minutes on a Kaggle T4).
#
#   python -m centipede configs/quick.toml

[run]
mode = "train"
name = "quick"
seed = 1
checkpoint_every_cycles = 3

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 1024

[agents]
device = "cuda"

[agents.ppo]
# Eight minibatches per epoch: 1,024 worlds x 64 steps = 65,536 samples.
minibatch_size = 8192

[interaction_loop]
rollout_window_steps = 64
update_cycles = 3
