# Baseline: the first, small training run, against which later changes are
# compared one setting at a time (plan.md, Stage 8.4). Every value is a
# starting point to tune, not a rule.
# - 64 worlds x 64-step windows = 4,096 samples per update.
# - 32 cycles = 2,048 steps per world, so 32 updates.
# - Episodes of 1,024 steps (20 s simulated): every world gets at least two.
# - Minibatches of 512, so eight per pass over each update's samples.
# About 11 minutes on the RTX 3080, projected from the measured step time
# (0.29 s per step at 64 worlds; plan.md, Stage 8.4).
#
#   python -m centipede configs/baseline.toml

[run]
mode = "train"
name = "baseline"
seed = 1
checkpoint_every_cycles = 8

[environment]
max_episode_steps = 1024

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 64

[agents]
device = "cuda"

[agents.ppo]
minibatch_size = 512

[interaction_loop]
rollout_window_steps = 64
update_cycles = 32
