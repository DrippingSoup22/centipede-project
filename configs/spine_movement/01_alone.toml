# Spine control and the movement cost, 2026-10-08 (plan.md, Stage 8.4),
# decided with the user (docs/environment.md, Actions and Rewards):
# - every segment but the rear commands the spine joint behind it as a seventh
#   action, and observes that joint's angle and speed; the standing prototype
#   is widened, so it starts as before with the spine command at zero, and the
#   spine's spread starts at initial_action_std (0.5);
# - the movement cost charges each segment for how far the joints it commands
#   move in a step, squared, in units of the 25 degrees random commands move a
#   joint: the buzz of today's walk (0.64) costs about 30 times a calm stroke.
# The three runs of this queue differ only in the movement cost's parts of the
# cost budget: 0 (the spine alone), 1 (rule R2: buzzing stays a little better
# than standing still), 2 (beyond the rule: buzzing below standing still).
# Everything else as in configs/far_targets/01: targets 30-60 mm within 30
# degrees, arrival under the head, range circle 2.5, 256-step episodes, 64
# worlds, rollout window 64, minibatch 512, epochs 4, seed 1, from the
# standing prototype; 32 update cycles (about 14 min with the evaluation).
#
# Movement cost 0 parts: what the spine alone changes, against the first 32
# cycles of far_01 (arrivals 17-23%, turning toward the target's side in
# 53-61% of the seconds). Hypothesis: the head's neck turns it toward the
# target, so turning toward the target's side rises above chance; the spine
# also buzzes (about 8 degrees of bend), and legs touch somewhat more.

[run]
mode = "train"
name = "spine_01_alone"
seed = 1
checkpoint_every_cycles = 16
start_from = "runs/2026-10-07_2221_baseline_stage2"

[environment]
max_episode_steps = 256
spine_control = true

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 64

[environment.target]
distance_range_m = [0.030, 0.060]
bearing_range_deg = [-30, 30]
arrival = "head"
range_circle_ratio = 2.5

[environment.rewards]
arrival_reward = 1
step_cost_parts = 2
body_contact_cost_parts = 3
leg_contact_cost_parts = 1
movement_cost_parts = 0
random_command_movement_deg = 25
head_progress_ratio = 1
follower_progress_share = 1

[agents]
device = "cuda"

[agents.ppo]
minibatch_size = 512

[interaction_loop]
rollout_window_steps = 64
update_cycles = 32
