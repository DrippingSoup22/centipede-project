# Evaluation of a trained run, optionally next to the zero-action and
# random-action baselines (uncomment baselines to run them; each one takes as
# long as the agents). Set source to a run folder (its latest checkpoint) or to
# one checkpoint file inside it. The task settings are the run's own; any
# [environment] values written here replace them, for example to evaluate a
# GPU-trained run on the CPU or with lines at wider angles. Results go into the
# run's evaluations/ folder, with a replay recording of every world for each
# actor and seed unless record = false. Evaluations never tow.
#
#   python -m centipede configs/evaluation.toml

[run]
mode = "evaluate"
source = "runs/<run folder>"

[evaluation]
seeds = [101, 102]
episodes_per_seed = 4
# baselines = ["zero", "random"]

