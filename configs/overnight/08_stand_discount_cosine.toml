# Overnight queue, 2026-10-08 (plan.md, Stage 8.4). Every run here keeps the
# baseline's training settings and the middle reward agreed with the user:
# - reward: body contact 0.03 (highest), efficiency 0.01, leg contact 0.0025;
# - 64 worlds, episode length 1,024 steps, rollout window 64 steps, minibatch
#   size 512, epochs 4, 64 update cycles (4 episode lengths), about 25 min,
#   then the queue's evaluation, about 5 min.
# What this run changes from that reference:
#   from the standing prototype; discount 0.99, learning rate 1e-3 to 1e-4 along a cosine.
# The standing prototype is runs/2026-10-07_2221_baseline_stage2: the baseline trained for 64
# update cycles with the first reward, which stands but does not walk.

[run]
mode = "train"
name = "overnight_08_stand_discount_cosine"
seed = 1
checkpoint_every_cycles = 16
start_from = "runs/2026-10-07_2221_baseline_stage2"

[environment]
max_episode_steps = 1024

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 64

[environment.rewards]
body_contact_cost = 0.03
efficiency_cost = 0.01
leg_contact_cost = 0.0025

[agents]
device = "cuda"
learning_rate = 1e-3
learning_rate_schedule = "cosine"
final_learning_rate = 1e-4

[agents.ppo]
minibatch_size = 512
discount = 0.99

[interaction_loop]
rollout_window_steps = 64
update_cycles = 64
