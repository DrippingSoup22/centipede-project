# Overnight queue, 2026-10-08 (plan.md, Stage 8.4). Every run here keeps the
# baseline's training settings and the reward agreed with the user:
# - reward: arrival 20, body contact 0.01, efficiency 0.005, leg contact
#   0.0025. Any arrival beats standing still: arrival > 1,024 x (body + leg),
#   so even arriving on the last step, crawling with legs always touching
#   (+2.1 per segment), beats standing for the whole episode (-5.1);
# - 64 worlds, episode length 1,024 steps, rollout window 64 steps, minibatch
#   size 512, epochs 4, 64 update cycles (4 episode lengths), about 25 min,
#   then the queue's evaluation, about 5 min.
# What this run changes from that reference:
#   from scratch; discount 0.995, learning rate 1e-3 to 1e-4 along a cosine.

[run]
mode = "train"
name = "overnight_07_scratch_discount_cosine"
seed = 1
checkpoint_every_cycles = 16

[environment]
max_episode_steps = 1024

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 64

[environment.rewards]
arrival_reward = 20
body_contact_cost = 0.01
efficiency_cost = 0.005
leg_contact_cost = 0.0025

[agents]
device = "cuda"
learning_rate = 1e-3
learning_rate_schedule = "cosine"
final_learning_rate = 1e-4

[agents.ppo]
minibatch_size = 512
discount = 0.995

[interaction_loop]
rollout_window_steps = 64
update_cycles = 64
