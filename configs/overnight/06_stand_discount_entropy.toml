# Overnight queue, 2026-10-08 (plan.md, Stage 8.4). Every run here keeps the
# baseline's training settings and the reward agreed with the user:
# - reward: arrival 10, body contact 0.01, efficiency 0.005, leg contact
#   0.0025. Per segment, standing still for the whole episode scores -5.1;
#   an upright arrival beats it whenever it comes (on the last step, with legs
#   always touching, +2.3), and a crawling one unless it takes over about 860
#   steps. Walking upright beats crawling by 0.01 per step, 15% of the arrival
#   on a 150-step trip (9.2 against 7.6);
# - 64 worlds, episode length 1,024 steps, rollout window 64 steps, minibatch
#   size 512, epochs 4, 64 update cycles (4 episode lengths), about 25 min,
#   then the queue's evaluation, about 5 min.
# What this run changes from that reference:
#   from the standing prototype; discount 0.995, entropy coefficient 0.01.
# The standing prototype is runs/2026-10-07_2221_baseline_stage2: the baseline trained for 64
# update cycles with the first reward, which stands but does not walk.

[run]
mode = "train"
name = "overnight_06_stand_discount_entropy"
seed = 1
checkpoint_every_cycles = 16
start_from = "runs/2026-10-07_2221_baseline_stage2"

[environment]
max_episode_steps = 1024

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 64

[environment.rewards]
arrival_reward = 10
body_contact_cost = 0.01
efficiency_cost = 0.005
leg_contact_cost = 0.0025

[agents]
device = "cuda"

[agents.ppo]
minibatch_size = 512
discount = 0.995
entropy_coefficient = 0.01

[interaction_loop]
rollout_window_steps = 64
update_cycles = 64
