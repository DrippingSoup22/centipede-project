# Full training, the long level: about a day on a Kaggle T4, two sessions of
# notebooks/kaggle_training.ipynb (an estimate until measured; plan.md, Stage
# 8.2). Every value not written here is the
# default in docs/configuration.md. 1,024 worlds and 256-step windows were
# agreed in Stage 8.2; the number of cycles follows from the measured speed. A run
# longer than one Kaggle session is continued with a file such as:
#
#   [run]
#   mode = "train"
#   continue_from = "runs/<this run's folder>"
#
#   python -m centipede configs/training.toml

[run]
mode = "train"
name = "training"
seed = 1
checkpoint_every_cycles = 16
# The window before each checkpoint is recorded for replay (record_every_cycles
# defaults to checkpoint_every_cycles), keeping 4 levels x 8 worlds by rank.

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 1024

[agents]
device = "cuda"

[agents.ppo]
# Eight minibatches per epoch: 1,024 worlds x 256 steps = 262,144 samples.
# A minibatch costs about the same time whatever its size, so fewer, larger
# ones make the update short (Stage 8.1).
minibatch_size = 32768

[interaction_loop]
rollout_window_steps = 256
update_cycles = 128
