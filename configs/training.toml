# Full training, the long level: about 7.5 hours on an RTX 3080, which takes
# about 0.82 s per step at 1,024 worlds, so 3.5 minutes per cycle (8.9 on a
# T4). Every value not written here is the default in docs/configuration.md.
# A stopped run is continued with a file such as:
#
#   [run]
#   mode = "train"
#   continue_from = "runs/<this run's folder>"
#
#   python -m centipede configs/training.toml

[run]
mode = "train"
name = "training"
seed = 1
checkpoint_every_cycles = 16
# No replay recordings: one whole episode (8,192 steps) of 1,024 worlds would
# need about 2.4 GiB of GPU memory while it is recorded.
recordings = 0

[environment.simulation]
model_path = "models/assembly_v4.xml"
backend = "gpu"
world_count = 1024

[agents]
device = "cuda"

[agents.ppo]
# Eight minibatches per epoch: 1,024 worlds x 256 steps = 262,144 samples.
# A minibatch costs about the same time whatever its size, so fewer, larger
# ones make the update short.
minibatch_size = 32768

[interaction_loop]
rollout_window_steps = 256
update_cycles = 128
