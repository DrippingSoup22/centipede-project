# Full training, the long level: about 7.5 hours on the RTX 3080, projected
# from the measured step time (plan.md, Stage 8.4): 0.82 s per step at 1,024
# worlds, so 3.5 minutes per cycle (8.9 on a Kaggle T4). Every value not
# written here is the default in docs/configuration.md. 1,024 worlds and
# 256-step windows were agreed in Stage 8.2. A stopped run is continued with a
# file such as:
#
#   [run]
#   mode = "train"
#   continue_from = "runs/<this run's folder>"
#
#   python -m centipede configs/training.toml

[run]
mode = "train"
name = "training"
seed = 1
checkpoint_every_cycles = 16
# No replay recordings: one whole episode (8,192 steps) of 1,024 worlds would
# need about 2.4 GiB of GPU memory while it is recorded.
record_every_episodes = 0

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 1024

[agents]
device = "cuda"

[agents.ppo]
# Eight minibatches per epoch: 1,024 worlds x 256 steps = 262,144 samples.
# A minibatch costs about the same time whatever its size, so fewer, larger
# ones make the update short (Stage 8.1).
minibatch_size = 32768

[interaction_loop]
rollout_window_steps = 256
update_cycles = 128
