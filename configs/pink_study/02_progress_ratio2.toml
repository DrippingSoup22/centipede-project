# Pink-noise study, 2026-10-09 (results/pink_study/): night test 05 with one
# change per file; see 01_gae_lambda09.toml for the protocol.
#
# Test 02: head_progress_ratio 2 instead of 1, so that each halving of the
# head's distance is worth two whole episodes of step cost (0.46 instead of
# 0.23, to every segment) and walking away costs twice as much. In test 05's
# last quarter the reward per step was: arrival +0.0014, progress +0.0008,
# step cost -0.0009 (the same on every step), contacts -0.0001. The costs
# hardly differ between behaviours, so the balance of progress against
# arrival is the weight that shapes the walk. Test 05's aim got worse as its
# arrivals rose (heading error 33 -> 102 degrees, half its episodes ending no
# closer): with targets this near, a fast, badly aimed walk still arrives
# often. More weight on progress pays for aim on every step. The rules still
# hold: a halving stays worth more than a whole episode of leg contact (R2),
# and the costs are unchanged (R1). Question: does the aim improve, and the
# arrivals with it? About 50 minutes on the 3080, 70 on a Kaggle T4.

[run]
mode = "train"
name = "pink_02_progress_ratio2"
seed = 1
checkpoint_every_cycles = 16
start_from = "runs/2026-10-07_2221_baseline_stage2"

[environment]
max_episode_steps = 256
spine_control = true

[environment.simulation]
model_path = "models/assembly_v3.xml"
backend = "gpu"
world_count = 256

[environment.target]
distance_range_m = [0.030, 0.060]
bearing_range_deg = [-30, 30]
arrival = "head"
range_circle_ratio = 2.5

[environment.rewards]
arrival_reward = 1
step_cost_parts = 2
body_contact_cost_parts = 3
leg_contact_cost_parts = 1
movement_cost_parts = 0
head_progress_ratio = 2
follower_progress_share = 1

[agents]
device = "cuda"
exploration_noise_beta = 1.0

[agents.ppo]
minibatch_size = 2048

[interaction_loop]
rollout_window_steps = 64
update_cycles = 96
