# Evaluation after each pink-study run: the queue replaces source with the
# run's folder. Seeds 102 and 103, 64 worlds each, so that the mean action's
# arrival rate rests on 128 episodes (32 left a spread of about 9 points
# either way); night test 05's two seeds get the same evaluation from
# configs/night/evaluations/.

[run]
mode = "evaluate"
source = "runs/FILLED_IN_BY_THE_QUEUE"

[evaluation]
seeds = [102, 103]
episodes_per_seed = 64
