# Compare CPU execution layouts for the ordinary training profile. Every
# combination of the listed values becomes one training run; single values
# apply to all runs. Without an [evaluation] table, only timing is compared.
kind = "comparison"
base = "train.toml"
output_root = "../../runs/comparisons"

[grid.training]
environment_count = [32, 64]
worker_count = [6, 8, 16]
max_episode_steps = [8192]
update_cycles = [2]
