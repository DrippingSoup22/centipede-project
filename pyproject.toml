[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "centipede"
version = "0.1.0"
description = "Independent segment agents learning to walk a simulated centipede"
readme = "README.md"
requires-python = ">=3.11"
# MuJoCo is pinned to the version the frozen model was validated with.
# RL_lib and MujocoReplay are also needed but not listed: they are sibling
# projects, not published on PyPI, installed from their folders or their
# GitHub repositories first (README, Setup). Listed by name, pip would look
# for them on PyPI, where a package of the same name could be someone else's.
dependencies = [
    "mujoco==3.12.0",
    "numpy>=2,<3",
    # Writes each run's complete configuration back out as TOML.
    "tomli-w",
    "torch",
]

[project.optional-dependencies]
# The GPU backend. Warp comes from NVIDIA's CUDA 12 wheels: the default CUDA 13
# build no longer supports Pascal GPUs such as the local MX330, and CUDA 12 needs
# an older minimum driver on cloud machines.
gpu = [
    "warp-lang @ https://github.com/NVIDIA/warp/releases/download/v1.17.0/warp_lang-1.17.0%2Bcu12-py3-none-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "warp-lang @ https://github.com/NVIDIA/warp/releases/download/v1.17.0/warp_lang-1.17.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "mujoco-warp==3.14.0",
]
dev = [
    "pybind11-stubgen",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

# The run report's page, which the experiment fills with the run's data.
[tool.setuptools.package-data]
centipede = ["experiment/report_page.html"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
typeCheckingMode = "standard"
# MuJoCo ships compiled code without type descriptions; generate them into
# typings/ (see README, Setup) so the editor knows MuJoCo's functions.
stubPath = "typings"
