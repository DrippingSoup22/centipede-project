<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A9B3C1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="580" rx="12" fill="#1E222A"/>

  <!-- Configuration -->
  <rect x="270" y="10" width="180" height="34" rx="6" fill="#1E222A" stroke="#7D8590" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="360" y="32" font-size="14" fill="#A9B3C1" text-anchor="middle">TOML configuration</text>
  <line x1="360" y1="44" x2="360" y2="72" stroke="#A9B3C1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Experiment -->
  <rect x="270" y="74" width="180" height="44" rx="8" fill="#24344F" stroke="#4C8DFF" stroke-width="1.5"/>
  <text x="360" y="101" font-size="16" fill="#E6EDF3" text-anchor="middle">Experiment</text>
  <line x1="360" y1="118" x2="360" y2="146" stroke="#A9B3C1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Interaction loop -->
  <rect x="270" y="148" width="180" height="44" rx="8" fill="#24344F" stroke="#4C8DFF" stroke-width="1.5"/>
  <text x="360" y="175" font-size="16" fill="#E6EDF3" text-anchor="middle">Interaction loop</text>

  <!-- Agents group -->
  <rect x="30" y="240" width="300" height="260" rx="12" fill="#262C36" stroke="#8B95A5" stroke-width="1.5"/>
  <text x="50" y="266" font-size="16" font-weight="bold" fill="#E6EDF3">Agents</text>
  <rect x="50" y="282" width="260" height="36" rx="8" fill="#24344F" stroke="#4C8DFF" stroke-width="1.5"/>
  <text x="180" y="305" font-size="13" fill="#E6EDF3" text-anchor="middle">Splits observations · joins actions</text>
  <rect x="86" y="334" width="214" height="132" rx="8" fill="#2F3642" stroke="#5A6372"/>
  <rect x="72" y="344" width="214" height="132" rx="8" fill="#2F3642" stroke="#5A6372"/>
  <rect x="58" y="354" width="214" height="132" rx="8" fill="#2F3642" stroke="#8B95A5" stroke-width="1.5"/>
  <text x="76" y="380" font-size="15" font-weight="bold" fill="#E6EDF3">Segment agent</text>
  <text x="256" y="380" font-size="15" fill="#A9B3C1" text-anchor="end">× N</text>
  <text x="76" y="406" font-size="13" fill="#A9B3C1">networks</text>
  <text x="76" y="426" font-size="13" fill="#A9B3C1">optimizer</text>
  <text x="76" y="446" font-size="13" fill="#A9B3C1">normalizer</text>
  <text x="76" y="466" font-size="13" fill="#A9B3C1">rollout storage</text>

  <!-- RL_lib -->
  <line x1="180" y1="500" x2="180" y2="528" stroke="#A9B3C1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="120" y="530" width="120" height="34" rx="6" fill="#1E222A" stroke="#7D8590" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="180" y="552" font-size="14" fill="#A9B3C1" text-anchor="middle">RL_lib</text>

  <!-- Environment group -->
  <rect x="370" y="240" width="330" height="260" rx="12" fill="#262C36" stroke="#8B95A5" stroke-width="1.5"/>
  <text x="390" y="266" font-size="16" font-weight="bold" fill="#E6EDF3">Environment</text>
  <rect x="390" y="282" width="290" height="36" rx="8" fill="#24344F" stroke="#4C8DFF" stroke-width="1.5"/>
  <text x="535" y="305" font-size="13" fill="#E6EDF3" text-anchor="middle">Episode state · coordination</text>
  <rect x="390" y="332" width="140" height="40" rx="8" fill="#2F3642" stroke="#8B95A5" stroke-width="1.5"/>
  <text x="460" y="357" font-size="13" fill="#E6EDF3" text-anchor="middle">Observation builder</text>
  <rect x="540" y="332" width="140" height="40" rx="8" fill="#2F3642" stroke="#8B95A5" stroke-width="1.5"/>
  <text x="610" y="357" font-size="13" fill="#E6EDF3" text-anchor="middle">Reward function</text>
  <rect x="390" y="386" width="290" height="100" rx="8" fill="#2F3642" stroke="#8B95A5" stroke-width="1.5"/>
  <text x="408" y="412" font-size="15" font-weight="bold" fill="#E6EDF3">Physics simulation</text>
  <text x="408" y="438" font-size="13" fill="#A9B3C1">CPU backend: MuJoCo</text>
  <text x="408" y="460" font-size="13" fill="#A9B3C1">GPU backend: MuJoCo Warp</text>

  <!-- Model files -->
  <line x1="610" y1="530" x2="610" y2="488" stroke="#A9B3C1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="550" y="530" width="120" height="34" rx="6" fill="#1E222A" stroke="#7D8590" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="610" y="552" font-size="14" fill="#A9B3C1" text-anchor="middle">Model files</text>

  <!-- Calls from the interaction loop, drawn last so they stay on top -->
  <path d="M320,192 V214 H180 V280" fill="none" stroke="#A9B3C1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400,192 V214 H535 V280" fill="none" stroke="#A9B3C1" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
