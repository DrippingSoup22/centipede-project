<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A9B3C1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="420" rx="12" fill="#1E222A"/>

  <!-- Configuration entering at the top -->
  <rect x="230" y="10" width="180" height="34" rx="6" fill="#1E222A" stroke="#7D8590" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="32" font-size="14" fill="#A9B3C1" text-anchor="middle">TOML configuration</text>
  <line x1="320" y1="44" x2="320" y2="68" stroke="#A9B3C1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 4 -->
  <rect x="20" y="70" width="600" height="62" rx="10" fill="#262C36" stroke="#3A4250"/>
  <circle cx="54" cy="101" r="17" fill="#4C8DFF"/>
  <text x="54" y="107" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <rect x="90" y="80" width="510" height="42" rx="8" fill="#2F3642" stroke="#8B95A5" stroke-width="1.5"/>
  <text x="345" y="107" font-size="16" fill="#E6EDF3" text-anchor="middle">Experiment</text>

  <!-- Layer 3 -->
  <rect x="20" y="142" width="600" height="62" rx="10" fill="#262C36" stroke="#3A4250"/>
  <circle cx="54" cy="173" r="17" fill="#4C8DFF"/>
  <text x="54" y="179" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <rect x="90" y="152" width="510" height="42" rx="8" fill="#2F3642" stroke="#8B95A5" stroke-width="1.5"/>
  <text x="345" y="179" font-size="16" fill="#E6EDF3" text-anchor="middle">Interaction loop</text>

  <!-- Layer 2 -->
  <rect x="20" y="214" width="600" height="62" rx="10" fill="#262C36" stroke="#3A4250"/>
  <circle cx="54" cy="245" r="17" fill="#4C8DFF"/>
  <text x="54" y="251" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <rect x="90" y="224" width="245" height="42" rx="8" fill="#2F3642" stroke="#8B95A5" stroke-width="1.5"/>
  <text x="212" y="251" font-size="16" fill="#E6EDF3" text-anchor="middle">Agents</text>
  <rect x="355" y="224" width="245" height="42" rx="8" fill="#2F3642" stroke="#8B95A5" stroke-width="1.5"/>
  <text x="477" y="251" font-size="16" fill="#E6EDF3" text-anchor="middle">Environment</text>

  <!-- Layer 1 -->
  <rect x="20" y="286" width="600" height="62" rx="10" fill="#262C36" stroke="#3A4250"/>
  <circle cx="54" cy="317" r="17" fill="#4C8DFF"/>
  <text x="54" y="323" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <rect x="90" y="296" width="510" height="42" rx="8" fill="#2F3642" stroke="#8B95A5" stroke-width="1.5"/>
  <text x="345" y="323" font-size="16" fill="#E6EDF3" text-anchor="middle">Physics simulation</text>

  <!-- Model files entering at the bottom -->
  <line x1="320" y1="376" x2="320" y2="350" stroke="#A9B3C1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="245" y="376" width="150" height="34" rx="6" fill="#1E222A" stroke="#7D8590" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="398" font-size="14" fill="#A9B3C1" text-anchor="middle">Model files</text>
</svg>
